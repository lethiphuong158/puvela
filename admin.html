<script>
/* ============================================================
   ĐĂNG GIÁ LÊN WEB PUVELA
   Site đọc product_variants.price (ĐƠN VỊ ĐỒNG), khớp theo
   (product_slug, label). Admin ghi thẳng vào đó.
   ============================================================ */
let WEB_SLUGS = lsGet('pm_web_slugs', null);      // [{slug,name}] tải từ Supabase

const toVND     = v => Math.round(isD() ? num(v) : num(v)*1000);
const webCh     = () => DB.settings.webChannel || (chList()[1]||chList()[0]||{}).id;
const dsz       = () => num(DB.settings.decantSize)||10;
const lbDecant  = () => `Chiết ${dsz()}ml`;
const lbFull    = p => num(p.sizeMl) ? `Full ${num(p.sizeMl)}ml` : null;

/* những gì sẽ được đẩy lên cho 1 sản phẩm */
const saleOf = (p,kind) => num((p.salePrice||{})[kind]);
function webPlan(p){
  const c = calc(p, webCh());
  const rows = [];
  const dong = (thuong, sale) => {                 // giá đang bán + giá gạch ngang
    if(sale && sale < thuong) return {price:toVND(sale), compare:toVND(thuong), pct:Math.round((1-sale/thuong)*100)};
    return {price:toVND(thuong), compare:null, pct:0};
  };
  dsizes().forEach((sz,i)=>{
    const von = costDecantFor(p, sz);
    let ban = dxGet(p, sz, webCh());
    if(!ban) ban = laCoChuan(sz) ? c.priceDecant
                                 : (von ? roundTo(von*chMarkup(webCh(),'decant'), DB.settings.roundTo) : 0);
    if(!ban) return;
    // giá sale chỉ áp cho cỡ chuẩn; cỡ khác giảm theo đúng tỉ lệ phần trăm đó
    const sale = saleOf(p,'decant');
    let saleSz = 0;
    if(sale && c.priceDecant) saleSz = laCoChuan(sz) ? sale : Math.round(ban * (sale/c.priceDecant));
    const g = dong(ban, saleSz);
    rows.push({kind:'chiet', label:`Chiết ${sz}ml`, volume_ml:sz, sort:i+1, ...g});
  });
  const lf = lbFull(p);
  if(lf && c.priceFull){ const g = dong(c.priceFull, saleOf(p,'full'));
    rows.push({kind:'full', label:lf, volume_ml:num(p.sizeMl), sort:3, ...g}); }
  const van = [];
  if(!p.webSlug) van.push('chưa ghép mã sản phẩm trên web');
  else {
    if(WEB_SLUGS && !WEB_SLUGS.some(x=>x.slug===p.webSlug)) van.push('mã mới — chưa tạo trong catalog web');
    const trung = DB.products.filter(x=>x.id!==p.id && x.webSlug===p.webSlug);
    if(trung.length) van.push('trùng mã với: ' + trung.map(x=>x.name).join(', '));
  }
  if(p.webSlugAuto) van.push('máy tự ghép — cần bạn xác nhận');
  if(!rows.length) van.push('chưa có giá cho kênh ' + chName(webCh()));
  // sale mà lỗ thì phải biết TRƯỚC khi đăng
  const sd = saleOf(p,'decant'), sf = saleOf(p,'full');
  if(sd && c.costDecant && sd <= c.costDecant) van.push(`giá sale chiết ${fmt(sd)} ≤ vốn ${fmt(Math.round(c.costDecant))}`);
  if(sf && c.costFull   && sf <= c.costFull)   van.push(`giá sale full ${fmt(sf)} ≤ vốn ${fmt(Math.round(c.costFull))}`);
  if(sd && c.priceDecant && sd >= c.priceDecant) van.push('giá sale chiết không thấp hơn giá thường');
  if(sf && c.priceFull   && sf >= c.priceFull)   van.push('giá sale full không thấp hơn giá thường');
  return {rows, van, stock: calc(p).totalMl};
}
/*
   Mọi sản phẩm đều hiện ở đây, kể cả món vừa tạo chưa có mã.
   Trước đây chỉ hiện món đã ghép mã/được chọn đăng, khiến không thể nhập
   mã cho sản phẩm mới từ tab Đăng web.
*/
const webList = () => {
  const q = norm(UI.q);
  if(!q) return DB.products;
  const terms = q.split(/\s+/);
  return DB.products.filter(p=>{
    const hay = norm([p.name, p.brand, p.note, p.webSlug].join(' '));
    return terms.every(t=>hay.includes(t));
  });
};

const webSlugHopLe = slug => /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug);
const slugTuTen = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const coTrongCatalog = p => !!(p.webSlug && WEB_SLUGS && WEB_SLUGS.some(x=>x.slug===p.webSlug));

/* Tạo bản ghi catalog tối thiểu cho một mã mới. Bản ghi luôn là nháp;
   chỉ webPush mới chuyển is_published thành true sau khi đã có giá. */
async function webTaoMoi(pid){
  const p = productById(pid); if(!p) return;
  const slug = String(p.webSlug||'').trim();
  if(!p.name.trim()){ toast('Nhập tên sản phẩm trước khi tạo trên web'); return; }
  if(!slug){ toast('Nhập mã trên web trước đã'); return; }
  if(!webSlugHopLe(slug)){
    toast('Mã chỉ dùng chữ thường, số và dấu gạch ngang (vd: gucci-flora-jasmine)'); return;
  }
  const trung = DB.products.some(x=>x.id!==p.id && x.webSlug===slug);
  if(trung){ toast('Mã này đang được ghép với một sản phẩm khác'); return; }
  try{
    await sbReady();
    const daCo = await sbFetch(`/rest/v1/products?slug=eq.${encodeURIComponent(slug)}&select=slug,name`);
    if(!(daCo||[]).length){
      const brandSlug = slugTuTen(p.brand||'');
      if(brandSlug) await sbFetch('/rest/v1/brands?on_conflict=slug', {
        method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
        body:JSON.stringify([{slug:brandSlug, name:p.brand.trim()}])});
      const row = {
        slug, name:p.name.trim(), is_published:false,
        category: p.brand ? `Nước hoa · ${p.brand}` : 'Nước hoa',
        description: p.note || `${p.name.trim()} chính hãng tại Puvela.`,
        notes:{top:'',mid:'',base:''}
      };
      if(brandSlug) row.brand_slug = brandSlug;
      if(p.longevity) row.longevity = p.longevity;
      if(p.sillage) row.sillage = p.sillage;
      await sbFetch('/rest/v1/products', {
        method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify([row])});
    }
    const item = {slug, name:p.name};
    WEB_SLUGS = (WEB_SLUGS||[]).filter(x=>x.slug!==slug).concat(item);
    lsSet('pm_web_slugs', WEB_SLUGS);
    save(); render();
    toast((daCo||[]).length ? 'Mã này đã có trong catalog — đã ghép xong' : 'Đã tạo sản phẩm nháp trên web — giờ có thể thêm ảnh');

async function anhUpload(pid, file, slot){
  slot = num(slot) || 1;
  const p = productById(pid); if(!p || !p.webSlug){ toast('Ghép mã sản phẩm trên web trước đã'); return; }
  if(!coTrongCatalog(p)){ toast('Bấm “Tạo sản phẩm mới” trên tab Đăng web trước khi tải ảnh'); return; }
  if(!/^image\//.test(file.type)){ toast('File này không phải ảnh'); return; }
  if(file.size > 5*1024*1024){ toast('Ảnh nặng quá 5MB — nén bớt rồi thử lại'); return; }
  toast('Đang tải ảnh lên…');
  try{
    await sbReady();
    const c = sbCfg(), sess = sbSess();
    const res = await fetch(`${c.url.replace(/\/+$/,'')}/storage/v1/object/products/${anhTen(p.webSlug,slot)}`, {
      method:'POST', headers:{apikey:c.key, Authorization:'Bearer '+sess.access_token,
                              'x-upsert':'true', 'Content-Type':file.type}, body:file});
    if(!res.ok){ let d=''; try{ d=(await res.json()).message||''; }catch(e){}
                 throw new Error(d || ('HTTP '+res.status)); }
    anhSlots(p)[slot] = Date.now();
    await anhLuuMeta(p);
    save(); if(ANH) openAnh(pid); else render();
    toast(slot===1 ? 'Đã đăng ảnh chính' : `Đã đăng ảnh ${slot}`);
  }catch(e){ toast('Không đăng được ảnh: ' + e.message); }
}
async function anhXoa(pid, slot){
  const p = productById(pid); if(!p || !p.webSlug) return;
  try{
    await sbReady();
    await sbFetch(`/storage/v1/object/products/${anhTen(p.webSlug,slot)}`, {method:'DELETE'});
  }catch(e){ /* ảnh có thể chưa từng tồn tại — không sao */ }
  delete anhSlots(p)[slot];
  try{ await anhLuuMeta(p); }catch(e){ toast('Xoá được ảnh nhưng chưa cập nhật web: '+e.message); }
  save(); if(ANH) openAnh(pid); else render();
  toast('Đã bỏ ảnh ' + (slot===1?'chính':slot));
}

async function webPush(){
  await sbReady();
  const items = DB.products.filter(p=>p.webPublish && p.webSlug);
  if(!items.length){ toast('Chưa có sản phẩm nào được tích đăng và ghép mã'); return; }
  let nVar=0, nProd=0; const loi=[];
  for(const p of items){
    const plan = webPlan(p);
    const chan = plan.van.filter(v=>/trùng mã|chưa tạo trong catalog|≤ vốn/.test(v));
    if(chan.length){ loi.push(`${p.name}: ${chan.join(' · ')} — bỏ qua`); continue; }
    if(!plan.rows.length){ loi.push(`${p.name}: không có giá để đăng`); continue; }
    const body = plan.rows.map(r=>{
      const o = {product_slug:p.webSlug, kind:r.kind, label:r.label,
                 volume_ml:r.volume_ml, price:r.price, sort:r.sort,
                 compare_at_price: r.compare};     // null = hết sale, phải gửi để xoá gạch ngang cũ
      // chỉ gửi tồn kho khi mình thực sự có theo dõi, tránh ghi đè 0 lên số của web
      if(plan.stock > 0) o.stock = Math.max(0, Math.floor(plan.stock / (r.kind==='full' ? (num(p.sizeMl)||1) : r.volume_ml)));
      return o;});
    try{
      await sbFetch('/rest/v1/product_variants?on_conflict=product_slug,label', {
        method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify(body)});
      nVar += body.length;
      await sbFetch(`/rest/v1/products?slug=eq.${encodeURIComponent(p.webSlug)}`, {
        method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify(
          Object.assign({is_published:true},
            p.longevity ? {longevity:p.longevity} : {},
            p.sillage   ? {sillage:p.sillage}     : {}))});
      p.webLive = true; p.webPushedAt = new Date().toISOString();
      nProd++;
    }catch(e){ loi.push(`${p.name}: ${e.message}`); }
  }
  // CHỈ ẩn những món CHÍNH APP NÀY đã từng đăng rồi bạn bỏ tích.
  // Không đụng vào sản phẩm khác trên web — ghép mã thôi chưa đủ để tắt của người ta.
  for(const p of DB.products.filter(x=>x.webSlug && x.webLive && !x.webPublish)){
    try{ await sbFetch(`/rest/v1/products?slug=eq.${encodeURIComponent(p.webSlug)}`, {
      method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({is_published:false})});
      p.webLive = false;
    }catch(e){ loi.push(`${p.name}: không ẩn được — ${e.message}`); }
  }
  DB.lastWebPush = new Date().toISOString(); save(); render();
  toast(loi.length ? `Đăng xong ${nProd} sản phẩm, ${loi.length} lỗi` : `Đã đăng ${nProd} sản phẩm · ${nVar} mức giá`);
  if(loi.length) ask('Một số món không đăng được:<br><br>' + loi.map(x=>'• '+esc(x)).join('<br>'), ()=>{}, 'Đã hiểu');
}

/* ---------- tự ghép theo tên ---------- */
function webAutoMatch(){
  if(!WEB_SLUGS || !WEB_SLUGS.length){ toast('Tải danh sách sản phẩm từ web trước đã'); return; }
  let n=0;
  DB.products.forEach(p=>{
    if(p.webSlug) return;
    const t = norm(p.name).split(/\s+/).filter(x=>x.length>2);
    if(!t.length) return;
    let best=null, bestScore=0;
    WEB_SLUGS.forEach(w=>{
      const hay = norm((w.name||'')+' '+w.slug);
      const score = t.filter(x=>hay.includes(x)).length / t.length;
      if(score > bestScore){ bestScore=score; best=w; }
    });
    if(best && bestScore >= 0.6){ p.webSlug = best.slug; p.webSlugAuto = true; n++; }
  });
  save(); render();
  toast(n ? `Đã tự ghép ${n} sản phẩm — kiểm tra lại trước khi đăng` : 'Không tìm được cặp nào đủ giống');
}

/* ---------- sự kiện ---------- */
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.matches('[data-sale]')){
    const p = productById(t.dataset.id); if(!p) return;
    if(!p.salePrice) p.salePrice = {};
    const v = t.value.trim();
    if(v==='') delete p.salePrice[t.dataset.sale];
    else { const n=num(v); if(n<0){ toast('Không nhận số âm'); render(); return; } p.salePrice[t.dataset.sale]=n; }
    p.updatedAt = today(); delete p.sample; save(); render(); return;
  }
  if(t.matches('[data-anh]')){ const f=t.files&&t.files[0];
    if(f) anhUpload(t.dataset.anh, f, t.dataset.slot); t.value=''; return; }
  if(t.matches('[data-simg]')){ const f=t.files&&t.files[0];
    if(f) siteAnhUpload(t.dataset.simg, f); t.value=''; return; }
  if(!t.matches('[data-web]')) return;
  const p = productById(t.dataset.id); if(!p) return;
  const f = t.dataset.web;
  if(f==='longevity' || f==='sillage'){
    const v = t.value.trim();
    if(v==='') delete p[f]; else p[f] = Math.max(1, Math.min(5, parseInt(v,10)||3));
  } else {
    p[f] = f==='webPublish' ? t.checked : t.value.trim();
  }
  if(f==='webSlug') delete p.webSlugAuto;          // bạn tự sửa = đã xác nhận
  p.updatedAt = today(); delete p.sample; save();
  if(f==='webSlug' || f==='webPublish') render();
});
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='webslugs'){ e.preventDefault();
    try{ const n = await webLoadSlugs(); render(); toast(`Đã tải ${n} sản phẩm từ web`); }
    catch(err){ toast('Không tải được: '+err.message); } }
  if(b.dataset.act==='webauto'){ e.preventDefault(); webAutoMatch(); }
  if(b.dataset.act==='webcreate'){ e.preventDefault();
    const p=productById(b.dataset.id); if(!p) return;
    ask(`Tạo sản phẩm nháp <b>${esc(p.name)}</b> với mã <code>${esc(p.webSlug||'')}</code> trên web?<br><br>Sản phẩm chưa hiện cho khách cho tới khi bạn đăng giá.`,
      ()=>webTaoMoi(p.id), 'Tạo sản phẩm nháp'); }
  if(b.dataset.act==='anh'){ e.preventDefault(); openAnh(b.dataset.id); }
  if(b.dataset.act==='toiweb'){ e.preventDefault(); closeModal();
    UI.tab='web'; UI.q=(productById(b.dataset.id)||{}).name||''; const q=$('#q'); if(q) q.value=UI.q;
    render(); toast('Ghép mã web cho sản phẩm này rồi quay lại thêm ảnh'); }
  if(b.dataset.act==='anhxoa'){ e.preventDefault(); anhXoa(b.dataset.id, num(b.dataset.slot)); }
  if(b.dataset.act==='webok'){ e.preventDefault();
    const p=productById(b.dataset.id); if(p){ delete p.webSlugAuto; save(); render(); } }
  if(b.dataset.act==='webpush'){ e.preventDefault();
    const n = DB.products.filter(p=>p.webPublish && p.webSlug).length;
    ask(`Đăng giá của <b>${n} sản phẩm</b> lên web puvela?<br>Khách sẽ thấy giá mới ngay khi tải lại trang.`,
      async ()=>{ try{ await webPush(); }catch(err){ toast('Lỗi: '+err.message); } }, 'Đăng lên web'); }
});
</script>

<script>
/* ============================================================
   ĐƠN KHÁCH ĐẶT TRÊN WEB — đọc từ bảng orders trên Supabase
   ============================================================ */
let WO = { list:null, dangTai:false, loc:'moi', loi:'' };
const WO_TT = {
  new:      {ten:'Mới',       mau:'warn'},
  confirmed:{ten:'Đã xác nhận',mau:'ok'},
  shipping: {ten:'Đang giao', mau:'ok'},
  done:     {ten:'Hoàn tất',  mau:'mute'},
  cancelled:{ten:'Đã huỷ',    mau:'bad'}
};
const woVND = n => (num(n)||0).toLocaleString('vi-VN')+'₫';

async function woTai(){
  if(WO.dangTai) return;
  WO.dangTai = true; WO.loi=''; render();
  try{
    await sbReady();
    WO.list = await sbFetch('/rest/v1/orders?select=*&order=created_at.desc&limit=300') || [];
  }catch(e){ WO.loi = e.message; WO.list = WO.list || []; }
  WO.dangTai = false; render();
}
async function woDoiTT(id, tt){
  try{
    await sbReady();
    await sbFetch(`/rest/v1/orders?id=eq.${id}`, {method:'PATCH', headers:{Prefer:'return=minimal'},
      body: JSON.stringify({status:tt})});
    const o = (WO.list||[]).find(x=>x.id==id); if(o) o.status = tt;
    render(); toast('Đã chuyển sang "'+(WO_TT[tt]||{}).ten+'"');
  }catch(e){ toast('Không đổi được trạng thái: '+e.message); }
}

function viewWebOrders(){
  if(!sbSess()) return `<div class="card"><div class="empty"><b>Cần đăng nhập</b>
    Đơn khách đặt nằm trên Supabase. Vào tab Cài đặt đăng nhập trước.</div></div>`;
  if(WO.list === null && !WO.dangTai) { setTimeout(woTai, 0); }

  const all = WO.list || [];
  const dem = {};
  all.forEach(o=>{ const k=o.status||'new'; dem[k]=(dem[k]||0)+1; });
  const q = norm(UI.q);
  let ds = all.filter(o=>{
    if(WO.loc==='moi'  && (o.status||'new')!=='new') return false;
    if(WO.loc==='dang' && !['confirmed','shipping'].includes(o.status)) return false;
    if(WO.loc==='xong' && !['done','cancelled'].includes(o.status)) return false;
    if(q){ const hay = norm([o.code,o.customer_name,o.phone,o.address,(o.items||[]).map(i=>i.name).join(' ')].join(' '));
           if(!hay.includes(q)) return false; }
    return true;
  });

  const chip=(k,label,n)=>`<button class="chip ${WO.loc===k?'active':''}" data-act="woloc" data-k="${k}">${label}${n!==undefined?` <span class="n">${n}</span>`:''}</button>`;
  const doanhThu = all.filter(o=>o.status==='done').reduce((a,o)=>a+num(o.total),0);
  const choXuLy = dem.new||0;

  const rows = ds.map(o=>{
    const tt = WO_TT[o.status||'new'] || WO_TT.new;
    const mon = (o.items||[]).map(i=>`${esc(i.name)} · ${esc(i.label)} ×${num(i.qty)}`).join('<br>');
    const ngay = o.created_at ? new Date(o.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const sdt = String(o.phone||'').replace(/\s/g,'');
    return `<tr>
      <td class="l nm" data-l="Khách">
        <b>${esc(o.customer_name||'—')}</b>
        <div class="tiny muted">${esc(o.code||'')} · ${ngay}</div>
        <div class="tiny">${sdt?`<a href="tel:${esc(sdt)}">${esc(sdt)}</a> · <a href="https://zalo.me/${esc(sdt)}" target="_blank" rel="noopener">Zalo</a>`:'<span class="muted">chưa có SĐT</span>'}</div>
        <div class="tiny muted">${esc(o.address||'')}</div>
        ${o.note?`<div class="tiny" style="color:var(--warn)">Ghi chú: ${esc(o.note)}</div>`:''}
      </td>
      <td class="l" data-l="Món"><div class="tiny">${mon||'<span class="muted">—</span>'}</div></td>
      <td data-l="Thanh toán">
        <b class="num">${woVND(o.total)}</b>
        <div class="tiny muted">${o.payment_method==='cod'?'Thu khi giao':'Chuyển khoản'}</div>
        ${num(o.shipping_fee)?`<div class="tiny muted">ship ${woVND(o.shipping_fee)}</div>`:''}
      </td>
      <td data-l="Trạng thái"><span class="pill ${tt.mau}">${tt.ten}</span></td>
      <td data-l="">
        <select class="inp" data-wott="${o.id}" style="padding:6px 8px;font-size:12.5px">
          ${Object.entries(WO_TT).map(([k,v])=>`<option value="${k}" ${(o.status||'new')===k?'selected':''}>${v.ten}</option>`).join('')}
        </select>
        ${o.status==='done' && sdt ? `<button class="btn sm" data-act="xindg" data-id="${o.id}" style="margin-top:6px;width:100%"
            title="Mở Zalo với tin nhắn xin đánh giá đã soạn sẵn">✎ Xin đánh giá</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="kpis">
    <div class="kpi"><div class="k">Đơn chờ xử lý</div><div class="v" style="color:${choXuLy?'var(--warn)':'inherit'}">${choXuLy}</div><div class="s">${all.length} đơn tổng cộng</div></div>
    <div class="kpi"><div class="k">Đang giao</div><div class="v">${(dem.confirmed||0)+(dem.shipping||0)}</div><div class="s">đã xác nhận + đang giao</div></div>
    <div class="kpi"><div class="k">Doanh thu đơn hoàn tất</div><div class="v">${woVND(doanhThu)}</div><div class="s">${dem.done||0} đơn</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="filters">
      ${chip('moi','Chờ xử lý',dem.new||0)}
      ${chip('dang','Đang giao',(dem.confirmed||0)+(dem.shipping||0))}
      ${chip('xong','Đã xong',(dem.done||0)+(dem.cancelled||0))}
      ${chip('all','Tất cả',all.length)}
      <span class="spacer"></span>
      <button class="btn sm" data-act="wotai" ${WO.dangTai?'disabled':''}>${WO.dangTai?'Đang tải…':'⟳ Tải lại'}</button>
    </div>
    ${WO.loi?`<div class="pad" style="color:var(--bad)">Không tải được đơn: ${esc(WO.loi)}<br>
      <span class="tiny muted">Nếu báo permission denied thì chạy lại đoạn SQL trong Cài đặt (phần 5).</span></div>`:''}
    <div class="tblwrap">
      ${WO.dangTai && !all.length ? `<div class="empty">Đang tải đơn…</div>`
        : ds.length ? `<table class="resp"><thead><tr>
            <th class="l">Khách</th><th class="l">Món</th><th>Thanh toán</th><th>Trạng thái</th><th>Đổi</th>
          </tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty"><b>${all.length?'Không có đơn nào ở mục này':'Chưa có đơn nào từ website'}</b>
            ${all.length?'Thử chọn mục khác.':'Đơn khách đặt trên web sẽ hiện ở đây.'}</div>`}
    </div>
    <div class="legend"><span>Đây là đơn <b>khách tự đặt trên website</b>, khác với tab Đơn hàng (đơn bạn tự ghi).</span>
      <span>Đổi trạng thái ở đây <b>không</b> trừ tồn kho — ghi đơn tay ở tab Đơn hàng nếu muốn trừ kho.</span></div>
  </div>`;
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='wotai'){ e.preventDefault(); WO.list=null; woTai(); }
  if(b.dataset.act==='woloc'){ e.preventDefault(); WO.loc=b.dataset.k; render(); }
  if(b.dataset.act==='xindg'){ e.preventDefault();
    const o=(WO.list||[]).find(x=>x.id==b.dataset.id); if(!o) return;
    const sdt=String(o.phone||'').replace(/\D/g,'');
    const goc=(sbCfg().url||'').replace(/\/+$/,'');
    // địa chỉ web thật của bạn — sửa ở đây nếu đã có tên miền
    const web = DB.settings.webDomain || '';
    const link = it => web ? `${web}/product.html?p=${it.slug}` : `product.html?p=${it.slug}`;
    const mon = (o.items||[]).map(it=>`• ${it.name}: ${link(it)}`).join('\n');
    const tin = `Chào ${o.customer_name||'bạn'}, Puvela đây ạ.\n`+
      `Đơn ${o.code||''} mình đã giao xong rồi, bạn dùng thấy sao ạ?\n\n`+
      `Nếu tiện, bạn để lại vài dòng cảm nhận giúp Puvela nhé — bấm vào link, kéo xuống cuối trang, chọn "Viết đánh giá của bạn":\n${mon}\n\n`+
      `Cảm ơn bạn nhiều ạ.`;
    copyText(tin);
    window.open('https://zalo.me/'+sdt, '_blank', 'noopener');
  }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-wott]')) woDoiTT(e.target.dataset.wott, e.target.value);
});
</script>
<script>
/* ============================================================
   DUYỆT ĐÁNH GIÁ KHÁCH GỬI
   Khách gửi lên với is_published = false; chỉ hiện trên web sau khi bạn duyệt.
   ============================================================ */
let DG = { list:null, dangTai:false, loi:'' };
async function dgTai(){
  if(DG.dangTai) return;
  DG.dangTai = true; DG.loi=''; render();
  try{
    await sbReady();
    DG.list = await sbFetch('/rest/v1/reviews?select=*&order=created_at.desc&limit=200') || [];
  }catch(e){ DG.loi = e.message; DG.list = DG.list || []; }
  DG.dangTai = false; render();
  // render() chụp lại trạng thái mở/đóng TRƯỚC khi vẽ, nên phải bung thẻ SAU khi vẽ xong
  if((DG.list||[]).some(r=>!r.is_published)){
    const d = document.querySelector('details[data-keep="danhgia"]');
    if(d){ d.open = true; MO['danhgia'] = true; }
  }
}
async function dgSua(id, thayDoi, loiNhan){
  try{
    await sbReady();
    await sbFetch(`/rest/v1/reviews?id=eq.${id}`, {method:'PATCH', headers:{Prefer:'return=minimal'},
      body: JSON.stringify(thayDoi)});
    const r = (DG.list||[]).find(x=>x.id==id); if(r) Object.assign(r, thayDoi);
    render(); toast(loiNhan);
  }catch(e){ toast('Không đổi được: '+e.message); }
}
function dgXoa(id){
  const r=(DG.list||[]).find(x=>x.id==id);
  ask(`Xoá hẳn đánh giá của <b>${esc((r&&r.author)||'')}</b>? Không khôi phục được.`, async ()=>{
    try{ await sbReady();
      await sbFetch(`/rest/v1/reviews?id=eq.${id}`, {method:'DELETE', headers:{Prefer:'return=minimal'}});
      DG.list = (DG.list||[]).filter(x=>x.id!=id); render(); toast('Đã xoá');
    }catch(e){ toast('Không xoá được: '+e.message); }
  }, 'Xoá', true);
}

function dgThe(){
  if(!sbSess()) return '';
  if(DG.list === null && !DG.dangTai) setTimeout(dgTai, 0);
  const all = DG.list || [];
  const cho = all.filter(r=>!r.is_published);
  const dong = r => {
    const sao = '★'.repeat(num(r.rating)) + '☆'.repeat(Math.max(0,5-num(r.rating)));
    const sp = productById && DB.products.find(p=>p.webSlug===r.product_slug);
    const ngay = r.created_at ? new Date(r.created_at).toLocaleDateString('vi-VN') : '';
    return `<div class="dgrow">
      <div style="min-width:0">
        <div><b>${esc(r.author||'—')}</b> <span style="color:var(--gold)">${sao}</span>
          ${r.verified?'<span class="pill ok">đã mua</span>':''}
          ${r.is_published?'<span class="pill mute">đang hiện</span>':'<span class="pill warn">chờ duyệt</span>'}</div>
        <div class="tiny muted">${esc(sp?sp.name:r.product_slug||'')} · ${ngay}</div>
        <div class="tiny" style="margin-top:4px">${esc(r.body||'')}</div>
      </div>
      <div class="rowact" style="flex-wrap:wrap;gap:4px">
        ${r.is_published
          ? `<button class="btn sm" data-act="dgan" data-id="${r.id}">Ẩn đi</button>`
          : `<button class="btn sm primary" data-act="dgduyet" data-id="${r.id}">✓ Duyệt</button>`}
        <button class="btn sm" data-act="dgmua" data-id="${r.id}">${r.verified?'Bỏ nhãn đã mua':'Gắn "đã mua"'}</button>
        <button class="iconbtn" data-act="dgxoa" data-id="${r.id}" title="Xoá hẳn">🗑</button>
      </div>
    </div>`;
  };
  return `
  <details class="card sqlbox" data-keep="danhgia" style="margin-top:14px" ${cho.length?'open':''}>
    <summary><b>Đánh giá khách gửi</b>
      <span class="sub">${cho.length? `<span style="color:var(--warn);font-weight:700">${cho.length} chờ duyệt</span> · ${all.length} tổng cộng` : `${all.length} đánh giá`}</span></summary>
    <div class="pad">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn sm" data-act="dgtai" ${DG.dangTai?'disabled':''}>${DG.dangTai?'Đang tải…':'⟳ Tải lại'}</button>
      </div>
      ${DG.loi?`<p class="hint" style="color:var(--bad)">Không tải được: ${esc(DG.loi)}<br>Nếu báo permission denied thì chạy lại đoạn SQL (phần 6).</p>`:''}
      ${all.length ? all.map(dong).join('')
        : `<p class="hint">${DG.dangTai?'Đang tải…':'Chưa có đánh giá nào. Khách viết ở cuối trang sản phẩm trên web.'}</p>`}
      <p class="hint" style="margin-top:12px">Đánh giá mới <b>không tự hiện</b> trên web — phải bấm Duyệt. Nhãn “đã mua” chỉ bạn gắn được, khách không tự gắn.</p>
    </div>
  </details>`;
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const id = b.dataset.id;
  if(b.dataset.act==='dgtai'){ e.preventDefault(); DG.list=null; dgTai(); }
  if(b.dataset.act==='dgduyet'){ e.preventDefault(); dgSua(id, {is_published:true}, 'Đã duyệt — đánh giá hiện trên web'); }
  if(b.dataset.act==='dgan'){ e.preventDefault(); dgSua(id, {is_published:false}, 'Đã ẩn khỏi web'); }
  if(b.dataset.act==='dgmua'){ e.preventDefault();
    const r=(DG.list||[]).find(x=>x.id==id);
    dgSua(id, {verified: !(r&&r.verified)}, 'Đã đổi nhãn "đã mua"'); }
  if(b.dataset.act==='dgxoa'){ e.preventDefault(); dgXoa(id); }
});
</script>

<script>
/* ============================================================
   NHÃN NỔI BẬT TRÊN WEB (Best seller / Niche / Giá tốt / Hot)
   Nhãn nằm ở cột products.badge — mỗi sản phẩm chỉ mang được MỘT nhãn.
   ============================================================ */
const NHAN_LIST = ['', 'Best seller', 'Niche', 'Giá tốt', 'Hot'];
let NH = { list:null, dangTai:false, loi:'', chiNhan:true };

async function nhanTai(){
  if(NH.dangTai) return;
  NH.dangTai = true; NH.loi=''; render();
  try{
    await sbReady();
    NH.list = await sbFetch('/rest/v1/products?select=slug,name,badge,is_published&order=name&limit=300') || [];
  }catch(e){ NH.loi = e.message; NH.list = NH.list || []; }
  NH.dangTai = false; render();
}
async function nhanDoi(slug, nhan){
  try{
    await sbReady();
    await sbFetch(`/rest/v1/products?slug=eq.${encodeURIComponent(slug)}`, {
      method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({badge: nhan || null})});
    const p=(NH.list||[]).find(x=>x.slug===slug); if(p) p.badge = nhan || null;
    render(); toast(nhan ? `Đã gắn nhãn "${nhan}"` : 'Đã bỏ nhãn');
  }catch(e){ toast('Không đổi được nhãn: '+e.message); }
}

/* số lượng đã bán theo mã web — gộp đơn tay và đơn từ website, 90 ngày gần nhất */
function daBan(){
  const moc = new Date(Date.now() - 90*864e5).toISOString().slice(0,10);
  const dem = {};
  (DB.orders||[]).filter(o=>o.status==='done' && (o.date||'') >= moc).forEach(o=>{
    (o.items||[]).forEach(it=>{ const p=productById(it.pid);
      if(p && p.webSlug) dem[p.webSlug] = (dem[p.webSlug]||0) + num(it.qty); });
  });
  ((typeof WO!=='undefined' && WO.list) || []).filter(o=>o.status==='done' && (o.created_at||'') >= moc).forEach(o=>{
    (o.items||[]).forEach(it=>{ if(it.slug) dem[it.slug] = (dem[it.slug]||0) + num(it.qty); });
  });
  return dem;
}

function nhanThe(){
  if(!sbSess()) return '';
  if(NH.list === null && !NH.dangTai) setTimeout(nhanTai, 0);
  const all = NH.list || [];
  const ban = daBan();
  const dem = {}; all.forEach(p=>{ const k=p.badge||''; dem[k]=(dem[k]||0)+1; });
  let ds = NH.chiNhan ? all.filter(p=>p.badge) : all;
  ds = ds.slice().sort((a,b)=> (ban[b.slug]||0)-(ban[a.slug]||0) || (a.name||'').localeCompare(b.name||'','vi'));
  const topBan = Object.entries(ban).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const dong = p => `<div class="nhrow">
    <div style="min-width:0">
      <b>${esc(p.name)}</b>${p.is_published?'':' <span class="pill mute">đang ẩn</span>'}
      <div class="tiny muted">${esc(p.slug)}${ban[p.slug]?` · đã bán ${ban[p.slug]}`:''}</div>
    </div>
    <select class="inp" data-nhan="${esc(p.slug)}" style="max-width:170px;padding:6px 8px;font-size:12.5px">
      ${NHAN_LIST.map(n=>`<option value="${esc(n)}" ${(p.badge||'')===n?'selected':''}>${n||'— không nhãn —'}</option>`).join('')}
    </select>
  </div>`;

  return `
  <details class="card sqlbox" data-keep="nhan" style="margin-top:14px">
    <summary><b>Nhãn nổi bật trên web</b>
      <span class="sub">Best seller ${dem['Best seller']||0} · Niche ${dem['Niche']||0} · Giá tốt ${dem['Giá tốt']||0} · Hot ${dem['Hot']||0}</span></summary>
    <div class="pad">
      <p class="hint">Khối <b>“Những mùi hương được yêu thích nhất”</b> trên trang chủ lấy đúng những sản phẩm mang nhãn
        <b>Best seller</b>. Mỗi sản phẩm chỉ mang được <b>một</b> nhãn — gắn Best seller cho hàng đang là Niche thì nhãn Niche mất.</p>
      ${topBan.length ? `<div class="card" style="box-shadow:none;background:var(--panel2);margin:12px 0"><div class="pad">
        <div class="tiny muted" style="margin-bottom:6px">Bán chạy thật trong 90 ngày (gộp đơn tay và đơn từ web)</div>
        ${topBan.map(([sg,n],i)=>{ const p=all.find(x=>x.slug===sg);
          return `<div class="stat-row"><span>${i+1}. ${esc(p?p.name:sg)}${p&&p.badge==='Best seller'?' <span class="pill ok">đã gắn</span>':''}</span><b>${n} món</b></div>`;
        }).join('')}
      </div></div>` : `<p class="hint">Chưa có đơn hoàn tất nào trong 90 ngày nên chưa xếp hạng được. Cứ gắn nhãn tay trước.</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <button class="btn sm" data-act="nhantai" ${NH.dangTai?'disabled':''}>${NH.dangTai?'Đang tải…':'⟳ Tải lại'}</button>
        <button class="btn sm ${NH.chiNhan?'on':''}" data-act="nhanloc">${NH.chiNhan?'Đang xem: có nhãn':'Đang xem: tất cả'}</button>
      </div>
      ${NH.loi?`<p class="hint" style="color:var(--bad)">Không tải được: ${esc(NH.loi)}</p>`:''}
      ${ds.length ? ds.map(dong).join('')
        : `<p class="hint">${NH.dangTai?'Đang tải…':'Chưa sản phẩm nào mang nhãn. Bấm “Đang xem: có nhãn” để xem toàn bộ và gắn.'}</p>`}
    </div>
  </details>`;
}

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='nhantai'){ e.preventDefault(); NH.list=null; nhanTai(); }
  if(b.dataset.act==='nhanloc'){ e.preventDefault(); NH.chiNhan=!NH.chiNhan; render(); }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-nhan]')) nhanDoi(e.target.dataset.nhan, e.target.value);
});
</script>

  padding:9px 0;border-bottom:1px solid var(--line2)}
.nhrow:last-of-type{border-bottom:0}
@media(max-width:700px){.nhrow{flex-direction:column;align-items:stretch;gap:6px}
  .nhrow select{max-width:none !important}}
</style>
