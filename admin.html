<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý nước hoa — Bảng giá, tồn kho, đơn hàng</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="referrer" content="no-referrer" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F4F5; --panel:#FFFFFF; --panel2:#FBF8F9; --ink:#241820; --muted:#7C6F74;
  --line:#E7DFE2; --line2:#F0EAEC;
  --wine:#4E152E; --wine2:#6E2543; --wineSoft:#F6EAEF; --gold:#A8801F;
  --ok:#15754C; --okBg:#E6F4ED; --warn:#9A6206; --warnBg:#FBF0DD; --bad:#B32626; --badBg:#FBEAEA;
  --r:12px; --r2:9px;
  --shadow:0 1px 2px rgba(36,24,32,.05), 0 10px 30px -22px rgba(36,24,32,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141013; --panel:#1D181B; --panel2:#221C20; --ink:#F0E9EC; --muted:#A2949A;
    --line:#332A2E; --line2:#2A2226;
    --wine:#E7B7C6; --wine2:#F0CBD6; --wineSoft:#2E1E26; --gold:#D9B45E;
    --ok:#63D3A0; --okBg:#12291F; --warn:#E0AE5A; --warnBg:#2B2116; --bad:#F08585; --badBg:#2E1A1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#141013; --panel:#1D181B; --panel2:#221C20; --ink:#F0E9EC; --muted:#A2949A;
  --line:#332A2E; --line2:#2A2226;
  --wine:#E7B7C6; --wine2:#F0CBD6; --wineSoft:#2E1E26; --gold:#D9B45E;
  --ok:#63D3A0; --okBg:#12291F; --warn:#E0AE5A; --warnBg:#2B2116; --bad:#F08585; --badBg:#2E1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -22px rgba(0,0,0,.8);
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--wine)}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.topbar{max-width:1400px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:16px;color:var(--wine);white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;padding:9px 34px 9px 34px;border:1px solid var(--line);border-radius:999px;background:var(--panel);outline:none}
.search input:focus{border-color:var(--wine)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--muted);padding:4px 8px;border-radius:999px}
.tools{display:flex;gap:6px;align-items:center}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--wine)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.primary{color:var(--panel)}
.btn.on{background:var(--wineSoft);border-color:var(--wine);color:var(--wine)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.sync-ok{color:var(--ok)} .sync-pending{color:var(--warn)} .sync-busy{color:var(--wine)}
.sync-error,.sync-conflict{color:var(--bad)} .sync-off{color:var(--muted)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--badBg)}
nav.tabs{max-width:1400px;margin:0 auto;padding:8px 14px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:9px 13px;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button.active{color:var(--wine);border-bottom-color:var(--wine);background:var(--panel)}
main{padding-top:14px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card h2{font-size:14px;padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .sub{font-weight:500;font-size:12px;color:var(--muted)}
.pad{padding:14px}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel2)}
.chip.active{background:var(--wineSoft);border-color:var(--wine);color:var(--wine)}
.chip .n{opacity:.7;font-weight:700}
.spacer{flex:1}
.chsel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;background:var(--panel)}
.chsel select{border:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--wine);outline:none;padding:3px 4px}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--panel2);text-align:right;font-size:11.5px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap
}
thead th.l{text-align:left}
thead tr.grp th{text-transform:none;font-size:12px;letter-spacing:0;color:var(--ink);background:var(--panel2);border-bottom:none;padding-bottom:2px;padding-top:10px}
th.sep,td.sep{border-left:1px solid var(--line)}
tbody td{padding:2px 8px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody td.l{text-align:left}
td.nm{min-width:250px}
.nmrow{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.ok{background:transparent;border:1px solid var(--line)}
.cell{width:100%;min-width:66px;border:1px solid transparent;background:transparent;text-align:right;padding:6px 6px;border-radius:8px;outline:none}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--wine);background:var(--panel)}
.cell::placeholder{color:var(--muted);opacity:.85;font-style:italic}
.cell.txt{text-align:left;min-width:215px;font-weight:600}
.cell.brand{text-align:left;font-size:11.5px;color:var(--muted);font-weight:500;padding:1px 6px;margin-left:8px;width:calc(100% - 16px);min-width:0}
.refbtn{width:100%;min-width:78px;white-space:nowrap;text-align:right;padding:6px 6px;border:1px solid transparent;border-radius:8px;font:inherit;font-variant-numeric:tabular-nums;color:inherit}
.refbtn:hover{border-color:var(--line);background:var(--panel)}
.refbtn .rng{color:var(--muted);font-size:11.5px}
.refn{display:inline-block;margin-left:5px;font-size:10px;font-weight:700;background:var(--wineSoft);color:var(--wine);border-radius:99px;padding:1px 5px;vertical-align:middle}
.refrow{display:grid;grid-template-columns:112px 1fr 130px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
@media(max-width:700px){
  .refrow{grid-template-columns:1fr 34px;gap:6px 8px;padding:10px 0}
  .refrow .srcin{grid-column:1/-1;order:-1}
  .refrow input[type=date]{grid-column:1/2}
  .refhead{display:none}
}
.cell.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--okBg);color:var(--ok)}
.pill.warn{background:var(--warnBg);color:var(--warn)}
.pill.bad{background:var(--badBg);color:var(--bad)}
.pill.mute{background:var(--line2);color:var(--muted)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.iconbtn{padding:5px 7px;border-radius:8px;color:var(--muted);font-size:13px}
.iconbtn:hover{background:var(--wineSoft);color:var(--wine)}

/* customer mode */
body.gated header.top .search,
body.gated header.top .tools,
body.gated nav.tabs{display:none !important}
body.sell .hide-sell{display:none !important}
body.sell .cell{pointer-events:none}
body.sell .cell.sellable{pointer-events:auto;cursor:copy}

/* ---------- mobile cards ---------- */
@media (max-width:960px){
  .tblwrap{overflow-x:visible}
  table.resp, table.resp tbody, table.resp tr, table.resp td{display:block;width:100%}
  table.resp thead{display:none}
  table.resp tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);margin:10px;padding:6px 4px;box-shadow:var(--shadow)}
  table.resp td{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;border-bottom:1px solid var(--line2);padding:5px 10px}
  table.resp td:last-child{border-bottom:none}
  table.resp td::before{content:attr(data-l);font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;flex:none;text-transform:uppercase;letter-spacing:.02em}
  table.resp td.nm{display:block;text-align:left;padding-top:9px;padding-bottom:9px}
  table.resp td.nm::before{display:none}
  table.resp .cell{min-width:0;width:auto;flex:1;max-width:180px}
  table.resp .cell.txt{max-width:none;width:100%;font-size:15px}
  table.resp td.sep{border-left:none}
}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}

/* ---------- forms ---------- */
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);outline:none}
.inp:focus{border-color:var(--wine);background:var(--panel)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.hint{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:12px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,12,16,.5);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:760px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--panel);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
@media(min-width:760px){.modal{border-radius:16px}}
.modal header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.modal header h3{font-size:15.5px}
.modal .body{padding:16px}
.modal footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.close{font-size:20px;color:var(--muted);padding:2px 8px;border-radius:8px}

/* ---------- misc ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line2)}
.legend i{font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .18s, transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.warnlist{display:flex;flex-direction:column}
.warnlist .it{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
.warnlist .it:last-child{border-bottom:none}
.warnlist .it .g{flex:1;min-width:0}
.warnlist .it b{display:block;font-size:13.5px}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.stat-row:last-child{border-bottom:none}
.stat-row b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--wine)}
.mlbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.mlbar i{display:block;height:100%;background:var(--ok)}
.mlbar.low i{background:var(--bad)}
.sellprice{font-size:15px;font-weight:800;color:var(--wine)}
.itemrow{display:grid;grid-template-columns:1fr 92px 70px 70px 104px 32px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.itemrow .nmm{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.itemrow{grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 0}.itemrow .nmm{grid-column:1/-1}}
.pick{position:relative}
.picklist{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:10}
.picklist button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.picklist button:hover{background:var(--wineSoft)}
.picklist button small{display:block;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand">Quản lý nước hoa<small id="brandSub">bảng giá · tồn kho · đơn hàng</small></div>
    <div class="search">
      <span class="ic">⌕</span>
      <input id="q" type="search" placeholder="Tìm nhanh: gõ không dấu cũng ra (vd: coco, nar trang)" autocomplete="off" />
      <button class="clr" id="qclr" hidden>✕</button>
    </div>
    <div class="tools">
      <button class="btn" id="sellBtn" title="Ẩn giá vốn, chỉ hiện giá bán — đưa máy cho khách xem">👁 Chốt khách</button>
      <button class="btn ghost" id="lockBtn" data-act="khoa" title="Khoá màn hình, cần đăng nhập lại">🔒</button>
      <button class="btn ghost" id="syncBadge" data-act="gotosync" title="Trạng thái đồng bộ">○</button>
      <button class="btn ghost" id="themeBtn" title="Sáng / tối">◐</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="price" class="active">Bảng giá</button>
    <button data-tab="stock">Tồn kho</button>
    <button data-tab="orders">Đơn hàng</button>
    <button data-tab="report">Báo cáo</button>
    <button data-tab="wo">Đơn từ web</button>
    <button data-tab="web">Đăng web</button>
    <button data-tab="settings">Cài đặt</button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================
   QUẢN LÝ NƯỚC HOA — 1 file, dữ liệu lưu trong máy (localStorage)
   Đơn vị tiền: nghìn đồng (k). 4800 = 4.800.000đ
   ============================================================ */
const KEY = 'perfume_manager_v1';

/* ---------- utils ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();
const num  = v => { if(v===null||v===undefined||v==='') return 0;
                    const n = parseFloat(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));
                    return isFinite(n)?n:0; };
const has  = v => v!==null && v!==undefined && v!=='' && num(v)>0;
const fmt  = (n,d=0)=> (n===null||n===undefined||!isFinite(n)) ? '' :
             n.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
const isD  = () => DB && DB.settings && DB.settings.unit==='d';      // true = đang nhập theo ĐỒNG
const U    = () => isD() ? 'đ' : 'k';                                // hậu tố hiển thị
const vnd  = n => !isFinite(n)||!n ? '—' : Math.round(isD()? n : n*1000).toLocaleString('vi-VN')+'đ';
/* giá trị hiển thị trong ô nhập: luôn cùng một kiểu định dạng */
const fmtCell = v => (v===''||v===null||v===undefined) ? ''
                   : Number(v).toLocaleString('vi-VN',{maximumFractionDigits:2});
const uid  = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
/* ngày theo giờ của máy (KHÔNG dùng toISOString — sẽ lệch 1 ngày ở múi giờ VN) */
const dstr = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today= () => dstr(new Date());
const thisMonth = () => today().slice(0,7);
const esc  = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roundTo = (n,step)=> !step ? Math.round(n) : Math.round(n/step)*step;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }

/* ---------- dữ liệu mẫu (lấy từ bảng Excel của bạn) ---------- */
function seedProducts(){
  const r = (name,brand,sizeMl,refFull,costDecant,priceDecant,refDecant)=>({
    id:uid(), name, brand, sizeMl, costFull:'', priceFull:{}, refFull,
    costDecant, priceDecant: priceDecant?{tiktok:priceDecant}:{}, refDecant, refSource:'', note:'',
    stockFull:0, openMl:0, updatedAt:today(), sample:true
  });
  return [
    r('Le Labo Another 13','Le Labo','', '', 760, 820, 830),
    r('Chanel Coco Mademoiselle','Chanel', 100, 4800, 330, 450, 450),
    r('Prada Paradoxe Intense','Prada', 90, 3200, '', '', 360),
    r('Parfums de Marly Delina Exclusif','Parfums de Marly','', '', 810, '', ''),
    r('Delina EDP','Parfums de Marly', 90, '', 630, '', 780),
    r('Nar hồng','Narciso Rodriguez','', 2250, 190, '', 280),
    r('Nar trắng','Narciso Rodriguez', 100, 2250, 190, '', 280),
    r('Nar trắng cao','Narciso Rodriguez','', '', 170, '', 350),
    r('Nar tím','Narciso Rodriguez','', 1700, '', '', ''),
    r('Nar cam','Narciso Rodriguez','', 2200, '', '', 280),
    r('YSL Libre Berry Crush EDP','YSL','', '', '', '', 480),
    r('YSL Libre Flowers & Flames EDP','YSL','', '', 320, '', ''),
    r('YSL Libre EDP','YSL','', '', 310, '', ''),
    r('YSL Libre Vanille Couture','YSL','', '', '', '', 690),
    r('Miss Dior','Dior', 90, 4100, '', '', '')
  ];
}
const DEFAULTS = {
  version:1,
  settings:{ markupFull:1.30, markupDecant:1.45, decantSize:10, bottleCost:15,
             minMargin:15, roundTo:10, lowMl:20, theme:'auto',
             unit:'k', deriveFullFromDecant:false, webChannel:'web', decantSizes:'5, 10',
             channels:[
               {id:'tiktok', name:'TikTok',  markupFull:1.30, markupDecant:1.45},
               {id:'web',    name:'Website', markupFull:1.45, markupDecant:1.70}
             ] },
  products: seedProducts(),
  orders: [],
  purchases: [],
  history: []
};

/* ---------- state ---------- */
let DB;
try{ DB = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULTS); }
catch(e){ DB = structuredClone(DEFAULTS); }
/* chuẩn hoá dữ liệu — chạy cả lúc mở app lẫn lúc kéo bản mới từ Supabase về */
function normalizeDB(){
  for(const k in DEFAULTS) if(DB[k]===undefined) DB[k]=structuredClone(DEFAULTS[k]);
  for(const k in DEFAULTS.settings) if(DB.settings[k]===undefined) DB.settings[k]=DEFAULTS.settings[k];
  if(!DB.purchases) DB.purchases = [];
  if(!Array.isArray(DB.settings.channels) || !DB.settings.channels.length)
    DB.settings.channels = structuredClone(DEFAULTS.settings.channels);
  const ch0 = DB.settings.channels[0].id;
  DB.products.forEach(p=>{
    if(p.stockFull===undefined)p.stockFull=0; if(p.openMl===undefined)p.openMl=0;
    ['priceFull','priceDecant'].forEach(k=>{
      if(p[k]===null || p[k]===undefined) p[k] = {};
      else if(typeof p[k] !== 'object') p[k] = num(p[k]) ? {[ch0]: num(p[k])} : {};
    });
    if(!p.refsFull)   p.refsFull   = num(p.refFull)   ? [{price:num(p.refFull),   src:p.refSource||'', date:p.updatedAt||''}] : [];
    if(!p.refsDecant) p.refsDecant = num(p.refDecant) ? [{price:num(p.refDecant), src:p.refSource||'', date:p.updatedAt||''}] : [];
  });
}
normalizeDB();
const CH0 = DB.settings.channels[0].id;

const save = () => {
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('Không lưu được — bộ nhớ trình duyệt đầy'); }
  if(typeof syncTouch === 'function') syncTouch();      // đánh dấu cần đẩy lên Supabase
};

const MO = {};          // mục <details> nào đang mở
let TAB_TRUOC = null;
let UI = { tab:'price', q:'', filter:'all', sell:false, month:thisMonth(), dsize:null,
           channel:(DB.settings.channels&&DB.settings.channels[0]&&DB.settings.channels[0].id)||'tiktok' };

/* ---------- tính toán ---------- */
/* Suy ra giá còn thiếu từ bất kỳ mỏ neo nào có sẵn.
   Ưu tiên: số bạn nhập tay > số máy suy ra.                       */
function calc(p, chArg){
  const S = DB.settings;
  const ch = chArg || curCh();
  const size = num(p.sizeMl), dsz = num(S.decantSize)||10;
  const rF = refStats(p.refsFull), rD = refStats(p.refsDecant);
  const o = {
    size,
    ch,
    costFull:num(p.costFull), priceFull:pxGet(p.priceFull,ch), refFull:0,
    costDecant:num(p.costDecant), priceDecant:pxGet(p.priceDecant,ch), refDecant:0,
    d:{}  // d[field]=true nghĩa là máy suy ra, không phải bạn nhập
  };
  o.refF = rF; o.refD = rD;
  o.refFull   = rF.min;      // mức phải cạnh tranh = nơi bán rẻ nhất
  o.refDecant = rD.min;
  // 1. giá vốn mỗi ml — phải biết RÕ nguồn, không được lẫn giá thị trường vào giá vốn
  let perMl = null, src = null;
  if(o.costFull && size){ perMl = o.costFull/size; src='full'; }
  else if(o.costDecant && S.deriveFullFromDecant){ perMl = Math.max(0,(o.costDecant-num(S.bottleCost)))/dsz; src='decant'; }
  else if(o.refFull && size){ perMl = o.refFull/size; src='ref'; }   // chỉ để tham khảo, KHÔNG dùng định giá kho
  o.perMl = perMl; o.perMlSrc = src;
  o.perMlFromRef = src==='ref';

  // giá dùng để định giá hàng tồn — tuyệt đối không lấy giá thị trường
  o.valuePerMl = num(p.realPerMl)
    || (o.costFull && size ? o.costFull/size : 0)
    || (o.costDecant ? Math.max(0,(o.costDecant-num(S.bottleCost)))/dsz : 0);

  // 2. vốn còn thiếu — KHÔNG suy ngược chai từ giá chiết trừ khi bạn bật trong Cài đặt
  if(!o.costFull && perMl && size && !o.perMlFromRef && S.deriveFullFromDecant){ o.costFull = perMl*size; o.d.costFull=1; }
  if(!o.costDecant && perMl && !o.perMlFromRef){ o.costDecant = perMl*dsz + num(S.bottleCost); o.d.costDecant=1; }

  // 3. giá bán gợi ý = vốn × hệ số CỦA KÊNH ĐANG XEM
  if(!o.priceFull && o.costFull){ o.priceFull = roundTo(o.costFull*chMarkup(ch,'full'), S.roundTo); o.d.priceFull=1; }
  if(!o.priceDecant && o.costDecant){ o.priceDecant = roundTo(o.costDecant*chMarkup(ch,'decant'), S.roundTo); o.d.priceDecant=1; }
  // giá của mọi kênh, để xem đối chiếu
  o.byCh = {};
  chList().forEach(c=>{
    const pf = pxGet(p.priceFull,c.id)   || (o.costFull   ? roundTo(o.costFull*chMarkup(c.id,'full'), S.roundTo)   : 0);
    const pd = pxGet(p.priceDecant,c.id) || (o.costDecant ? roundTo(o.costDecant*chMarkup(c.id,'decant'), S.roundTo): 0);
    o.byCh[c.id] = { name:c.name, priceFull:pf, priceDecant:pd,
      setFull: !!pxGet(p.priceFull,c.id), setDecant: !!pxGet(p.priceDecant,c.id),
      profitFull: pf&&o.costFull? pf-o.costFull : null,
      profitDecant: pd&&o.costDecant? pd-o.costDecant : null };
  });

  // 4. lợi nhuận
  o.profitFull   = o.priceFull   && o.costFull   ? o.priceFull   - o.costFull   : null;
  o.profitDecant = o.priceDecant && o.costDecant ? o.priceDecant - o.costDecant : null;
  o.marginFull   = o.profitFull!==null   && o.priceFull   ? o.profitFull/o.priceFull*100     : null;
  o.marginDecant = o.profitDecant!==null && o.priceDecant ? o.profitDecant/o.priceDecant*100 : null;
  // lợi nhuận nếu chiết hết 1 chai full
  o.decantsPerBottle = size && dsz ? Math.floor(size/dsz) : null;
  o.profitIfDecantAll = o.decantsPerBottle && o.profitDecant!==null ? o.decantsPerBottle*o.profitDecant : null;

  // 5. cảnh báo
  o.flags = [];
  if(!o.costFull && !o.costDecant) o.flags.push({k:'nocost',lv:'warn',t:'Chưa có giá vốn'});
  if(o.priceFull && o.costFull && o.priceFull <= o.costFull) o.flags.push({k:'lossF',lv:'bad',t:'Bán full ≤ vốn'});
  if(o.priceDecant && o.costDecant && o.priceDecant <= o.costDecant) o.flags.push({k:'lossD',lv:'bad',t:'Bán chiết ≤ vốn'});
  if(o.marginFull!==null   && o.marginFull   > 0 && o.marginFull   < num(S.minMargin)) o.flags.push({k:'thinF',lv:'warn',t:'Lãi full mỏng'});
  if(o.marginDecant!==null && o.marginDecant > 0 && o.marginDecant < num(S.minMargin)) o.flags.push({k:'thinD',lv:'warn',t:'Lãi chiết mỏng'});
  if(o.priceFull && rF.n && o.priceFull > rF.max*1.02)
    o.flags.push({k:'overF',lv:'warn',t:`Giá full cao hơn cả ${rF.n>1?'mọi nguồn tham khảo':'giá thị trường'}`});
  else if(o.priceFull && rF.n>1 && o.priceFull > rF.min*1.02)
    o.flags.push({k:'overFmin',lv:'warn',t:`Giá full cao hơn nơi rẻ nhất (${fmt(Math.round(rF.min))})`});
  if(o.priceDecant && rD.n && o.priceDecant > rD.max*1.02)
    o.flags.push({k:'overD',lv:'warn',t:`Giá chiết cao hơn cả ${rD.n>1?'mọi nguồn tham khảo':'giá thị trường'}`});
  else if(o.priceDecant && rD.n>1 && o.priceDecant > rD.min*1.02)
    o.flags.push({k:'overDmin',lv:'warn',t:`Giá chiết cao hơn nơi rẻ nhất (${fmt(Math.round(rD.min))})`});
  if(!size) o.flags.push({k:'nosize',lv:'warn',t:'Thiếu dung tích (ml) — không suy được giá/ml'});
  const cap = num(S.unit==='d' ? 100000000 : 100000);   // 1 lọ chiết khó vượt mức này
  if([o.costDecant,o.priceDecant,rD.max].some(v=>v>cap))
    o.flags.push({k:'unit',lv:'bad',t:`Giá chiết lớn bất thường — có phải bạn gõ theo ${S.unit==='d'?'nghìn đồng':'đồng'}?`});
  o.worst = o.flags.some(f=>f.lv==='bad') ? 'bad' : (o.flags.length ? 'warn' : 'ok');

  // 6. tồn kho quy ra ml + giá trị vốn
  o.totalMl = num(p.stockFull)*size + num(p.openMl);
  o.realPerMl = num(p.realPerMl);                       // giá vốn thực, ghi lúc nhập kho
  o.stockValue = o.totalMl * o.valuePerMl;
  o.stockValueEstimated = !o.realPerMl && o.stockValue!==0;  // chưa có giá mua thực → chỉ là ước tính
  return o;
}

/* lịch sử thay đổi giá */
function logChange(pid, field, from, to){
  if(String(from||'') === String(to||'')) return;
  DB.history.unshift({ ts:new Date().toISOString(), pid, field, from:from||'', to:to||'' });
  if(DB.history.length > 800) DB.history.length = 800;
}
const FIELD_VN = { name:'Tên', brand:'Thương hiệu', sizeMl:'Dung tích', costFull:'Vốn full', priceFull:'Bán full',
  refFull:'Tham khảo full', costDecant:'Vốn chiết', priceDecant:'Bán chiết', refDecant:'Tham khảo chiết',
  refSource:'Nguồn', note:'Ghi chú', stockFull:'Chai full tồn', openMl:'ml đang chiết' };

/* ---------- kênh bán: một giá vốn, nhiều giá bán ---------- */
const chList  = () => (DB.settings.channels||[]).filter(c=>c && c.id);
const chById  = id => chList().find(c=>c.id===id) || chList()[0] || {id:'',name:'—'};
const curCh   = () => chById(UI.channel).id;
const curSize = () => { const l=dsizes(); const v=num(UI.dsize); return l.includes(v)? v : (num(DB.settings.decantSize)||l[0]); };
const chName  = id => chById(id).name;
const pxGet   = (o,ch) => num((o&&typeof o==='object') ? o[ch] : 0);
/* các cỡ chiết đang bán, vd 5 và 10ml. Cỡ CHUẨN (decantSize) dùng chung ô giá cũ. */
const dsizes = () => {
  const l = String(DB.settings.decantSizes||'').split(/[,;\s]+/).map(num).filter(v=>v>0);
  const std = num(DB.settings.decantSize)||10;
  if(!l.includes(std)) l.push(std);
  return [...new Set(l)].sort((a,b)=>a-b);
};
const laCoChuan = sz => num(sz) === (num(DB.settings.decantSize)||10);
const dxMap = p => (p.priceDecantBySize || (p.priceDecantBySize = {}));
/* giá bán lọ chiết cỡ sz, kênh ch — '' nghĩa là chưa đặt, để máy tự suy */
function dxGet(p, sz, ch){
  if(laCoChuan(sz)) return pxGet(p.priceDecant, ch);
  const m = dxMap(p)[String(num(sz))];
  return num(m && m[ch]);
}
function dxSet(p, sz, ch, val){
  if(laCoChuan(sz)){
    if(!p.priceDecant || typeof p.priceDecant!=='object') p.priceDecant = {};
    if(String(val).trim()==='') delete p.priceDecant[ch]; else p.priceDecant[ch] = num(val);
    return;
  }
  const k = String(num(sz)), m = dxMap(p);
  if(!m[k]) m[k] = {};
  if(String(val).trim()==='') delete m[k][ch]; else m[k][ch] = num(val);
  if(m[k] && !Object.keys(m[k]).length) delete m[k];
}
/* giá vốn lọ chiết cỡ sz: chất lỏng chia theo ml, vỏ chiết KHÔNG chia */
function costDecantFor(p, sz){
  const c = calc(p), bc = num(DB.settings.bottleCost), std = num(DB.settings.decantSize)||10;
  const cd = c.costDecant || 0; if(!cd) return 0;
  if(laCoChuan(sz)) return cd;
  const k = num(sz)/std;
  return cd > bc ? (cd-bc)*k + bc : cd*k;
}
const chMarkup= (ch,kind) => { const c=chById(ch);
  const v = num(kind==='full' ? c.markupFull : c.markupDecant);
  return v || num(kind==='full' ? DB.settings.markupFull : DB.settings.markupDecant); };

function refStats(list){
  const ps = (list||[]).map(r=>num(r.price)).filter(v=>v>0);
  if(!ps.length) return {n:0,min:0,max:0,avg:0};
  return {n:ps.length, min:Math.min(...ps), max:Math.max(...ps), avg:ps.reduce((a,b)=>a+b,0)/ps.length};
}
const refsOf = (p,kind)=> kind==='full' ? (p.refsFull||(p.refsFull=[])) : (p.refsDecant||(p.refsDecant=[]));

const NUMF = new Set(['sizeMl','costFull','refFull','costDecant',
                      'refDecant','stockFull','openMl']);
/* sửa giá bán của MỘT kênh */
function setPrice(pid, kind, ch, value){
  const p = productById(pid); if(!p) return false;
  const key = kind==='full' ? 'priceFull' : 'priceDecant';
  if(!p[key] || typeof p[key]!=='object') p[key] = {};
  const old = num(p[key][ch]);
  if(String(value).trim()===''){ delete p[key][ch]; }
  else {
    const n = num(value);
    if(n<0){ toast('Không nhận số âm — đã bỏ qua'); return false; }
    p[key][ch] = n;
  }
  p.updatedAt = today(); delete p.sample;
  logChange(pid, key+'@'+ch, old, num(p[key][ch]));
  save(); return true;
}
function setField(pid, field, value){
  const p = DB.products.find(x=>x.id===pid); if(!p) return false;
  let v = value;
  if(NUMF.has(field)){
    if(String(value).trim()==='') v = '';
    else {
      const n = num(value);
      if(n < 0){ toast('Không nhận số âm — đã bỏ qua'); return false; }
      v = n;                       // luôn lưu dạng SỐ, không lưu chuỗi "4.800"
    }
  }
  const old = p[field];
  p[field] = v;
  p.updatedAt = today();
  if(p.sample) delete p.sample;
  logChange(pid, field, old, v);
  save();
  return true;
}
function productById(id){ return DB.products.find(p=>p.id===id); }

/* ---------- lọc & tìm kiếm ---------- */
function filtered(){
  const q = norm(UI.q);
  let list = DB.products;
  if(q){
    const terms = q.split(/\s+/);
    list = list.filter(p=>{ const hay = norm(p.name+' '+(p.brand||'')+' '+(p.note||''));
                            return terms.every(t=>hay.includes(t)); });
  }
  if(UI.filter!=='all'){
    list = list.filter(p=>{
      const c = calc(p);
      if(UI.filter==='alert')   return c.flags.length>0;
      if(UI.filter==='missing') return !num(p.costFull) && !num(p.costDecant);
      if(UI.filter==='instock') return c.totalMl>0;
      if(UI.filter==='low')     return c.totalMl>0 && c.totalMl < num(DB.settings.lowMl);
      return true;
    });
  }
  return list;
}
</script>
<script>
/* ============================ RENDER ============================ */
/* Chạy trên tên miền công khai thì phải đăng nhập mới thấy gì.
   Mở bằng file trên máy hoặc localhost thì không khoá — máy riêng của bạn. */
function canKhoa(){
  if(location.protocol === 'file:') return false;
  const h = location.hostname;
  if(h==='localhost' || h==='127.0.0.1' || h==='' || h.endsWith('.local')) return false;
  return true;
}
function dangKhoa(){ return !!(UI.locked || (canKhoa() && !sbSess())); }

function viewGate(){
  const c = sbCfg();
  return `
  <div class="card" style="max-width:430px;margin:8vh auto 0">
    <h2>Khu vực quản lý</h2>
    <div class="pad">
      <p class="hint">Trang này chỉ dành cho chủ cửa hàng. Đăng nhập để xem bảng giá, tồn kho và đơn hàng.</p>
      <label class="fld"><span>Email</span><input class="inp" id="sbEmail" type="email" autocomplete="username" placeholder="email đăng nhập"></label>
      <label class="fld"><span>Mật khẩu</span><input class="inp" id="sbPw" type="password" autocomplete="current-password" placeholder="mật khẩu"></label>
      <input type="hidden" id="sbUrl" value="${esc(c.url)}"><input type="hidden" id="sbKey" value="${esc(c.key)}">
      <button class="btn primary" data-act="sblogin" style="width:100%">Đăng nhập</button>
      <p class="hint" style="margin-top:14px">Nếu bạn là khách ghé nhầm: <a href="/">quay lại cửa hàng</a>.</p>
    </div>
  </div>`;
}

function render(){
  if(typeof dangKhoa==='function' && dangKhoa()){
    document.body.classList.add('gated');
    $('#app').innerHTML = viewGate();
    return;
  }
  document.body.classList.remove('gated');
  document.body.classList.toggle('sell', UI.sell);
  $('#sellBtn').classList.toggle('on', UI.sell);
  $('#brandSub').textContent = UI.sell ? 'đang ẩn giá vốn — an toàn để khách xem'
                                       : 'bảng giá · tồn kho · đơn hàng';
  const sb=$('#syncBadge'); if(sb){ sb.hidden = UI.sell; if(typeof paintSyncBadge==='function') paintSyncBadge(); }
  const lk=$('#lockBtn'); if(lk) lk.hidden = UI.sell || !(typeof sbSess==='function' && sbSess());
  if(UI.sell) UI.tab = 'price';                      // khách chỉ được thấy bảng giá bán
  $$('#tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===UI.tab);
    b.hidden = UI.sell && b.dataset.tab!=='price';
  });
  $('#qclr').hidden = !UI.q;
  const app = $('#app');
  const views = {price:viewPrice, stock:viewStock, orders:viewOrders, report:viewReport, settings:viewSettings,
                 web: (typeof viewWeb==='function' ? viewWeb : viewPrice),
                 wo:  (typeof viewWebOrders==='function' ? viewWebOrders : viewPrice)};
  // vẽ lại không được làm mất chỗ đang đứng: nhớ mục nào đang mở và vị trí cuộn
  $$('details[data-keep]').forEach(d=>{ MO[d.dataset.keep] = d.open; });
  const yCu = window.scrollY, cungTab = (TAB_TRUOC === UI.tab);
  app.innerHTML = (views[UI.tab] || viewPrice)();
  $$('details[data-keep]').forEach(d=>{ if(MO[d.dataset.keep] !== undefined) d.open = MO[d.dataset.keep]; });
  if(cungTab) window.scrollTo(0, yCu); else { window.scrollTo(0,0); app.scrollTop = 0; }
  TAB_TRUOC = UI.tab;
}

/* ---------- ô nhập ---------- */
function inp(p, f, ph, cls=''){
  const val = esc(fmtCell(p[f]));
  return `<input class="cell num ${cls}" data-id="${p.id}" data-f="${f}" inputmode="decimal"
           value="${val}" placeholder="${ph?esc(ph):'—'}">`;
}
function money(n){ return n ? fmt(Math.round(n)) : '—'; }
function pxInp(p, kind, c){
  const ch = c || curCh();
  if(kind==='full'){
    const val = pxGet(p.priceFull, ch), sug = calc(p, ch).priceFull;
    return `<input class="cell num" data-px="full" data-ch="${ch}" data-id="${p.id}" inputmode="decimal"
      value="${val?esc(fmtCell(val)):''}" placeholder="${val?'':(sug?esc(fmt(Math.round(sug))):'—')}">`;
  }
  const sz = curSize(), val = dxGet(p, sz, ch);
  const goc = costDecantFor(p, sz);
  const sug = laCoChuan(sz) ? calc(p, ch).priceDecant
            : (goc ? roundTo(goc*chMarkup(ch,'decant'), DB.settings.roundTo) : 0);
  return `<input class="cell num" data-px="decant" data-sz="${sz}" data-ch="${ch}" data-id="${p.id}" inputmode="decimal"
    value="${val?esc(fmtCell(val)):''}" placeholder="${val?'':(sug?esc(fmt(Math.round(sug))):'—')}">`;
}
/* lãi của lọ chiết cỡ đang xem */
function laiChiet(p){
  const sz = curSize(), ch = curCh();
  const von = costDecantFor(p, sz);
  let ban = dxGet(p, sz, ch);
  if(!ban) ban = laCoChuan(sz) ? calc(p, ch).priceDecant
                              : (von ? roundTo(von*chMarkup(ch,'decant'), DB.settings.roundTo) : 0);
  if(!ban || !von) return marginPill(null);
  return marginPill(ban-von, (ban-von)/ban*100);
}
/* gợi ý thương hiệu = những thương hiệu đã có trong bảng, bỏ trùng, A–Z */
function brandList(){
  // gộp các biến thể chỉ khác hoa/thường, giữ cách viết được dùng nhiều nhất
  const groups = new Map();
  DB.products.forEach(p=>{
    const b = (p.brand||'').trim(); if(!b) return;
    const k = norm(b), g = groups.get(k) || new Map();
    g.set(b, (g.get(b)||0) + 1); groups.set(k, g);
  });
  const hoa = x => /^[A-ZÀ-Ỹ]/.test(x) ? 1 : 0;      // hoà phiếu thì ưu tiên bản viết hoa đầu câu
  return [...groups.values()]
    .map(g => [...g.entries()].sort((x,y)=> y[1]-x[1] || hoa(y[0])-hoa(x[0]))[0][0])
    .sort((x,y)=> x.localeCompare(y,'vi',{sensitivity:'base'}));
}
function brandOptions(){ return brandList().map(b=>`<option>${esc(b)}</option>`).join(''); }

function refCell(p, kind){
  const st = refStats(refsOf(p,kind));
  const body = !st.n ? '<span class="muted">＋ nguồn</span>'
    : st.n===1 || st.min===st.max ? fmt(Math.round(st.min))
    : `${fmt(Math.round(st.min))}<span class="rng">–${fmt(Math.round(st.max))}</span>`;
  const tip = !st.n ? 'Chưa có nguồn nào — bấm để thêm'
    : refsOf(p,kind).map(r=>`${fmt(num(r.price))}${r.src?' · '+r.src:''}`).join('\n');
  return `<button class="refbtn" data-act="refs" data-id="${p.id}" data-kind="${kind}" title="${esc(tip)}">
    ${body}${st.n>1?`<span class="refn">${st.n}</span>`:''}</button>`;
}
function marginPill(profit, margin){
  if(profit===null||profit===undefined) return '<span class="pill mute">—</span>';
  const m = margin||0;
  const lv = profit<=0 ? 'bad' : (m < num(DB.settings.minMargin) ? 'warn' : 'ok');
  return `<span class="pill ${lv}">${profit>0?'+':''}${fmt(Math.round(profit))} · ${m.toFixed(0)}%</span>`;
}
function stockLabel(p,c){
  const parts=[];
  if(num(p.stockFull)) parts.push(num(p.stockFull)+' chai');
  if(num(p.openMl))    parts.push(fmt(num(p.openMl))+'ml');
  if(!parts.length) return '<span class="muted tiny">hết</span>';
  const low = c.totalMl < num(DB.settings.lowMl);
  return `<span class="tiny ${low?'':'muted'}" ${low?'style="color:var(--bad);font-weight:700"':''}>${parts.join(' · ')}</span>`;
}

    <td class="sep" data-l="Tồn kho">${stockLabel(p,c)}</td>

function sellRow(p){
  const c = calc(p);
  const cp = (label,val)=> val ? `<button class="sellprice" data-act="copy" data-copy="${esc(p.name)} — ${label}: ${fmt(Math.round(val))}${U()}">${fmt(Math.round(val))}</button>` : '<span class="muted">—</span>';

    <td data-l="Thị trường"><span class="muted tiny">${c.refF.n>1?`${money(c.refF.min)}–${money(c.refF.max)}`:money(c.refF.min)}</span></td>
    <td class="sep" data-l="Giá chiết ${num(DB.settings.decantSize)}ml">${cp('chiết '+num(DB.settings.decantSize)+'ml', c.priceDecant)}</td>
    <td data-l="Thị trường"><span class="muted tiny">${c.refD.n>1?`${money(c.refD.min)}–${money(c.refD.max)}`:money(c.refD.min)}</span></td>
    <td data-l=""><button class="iconbtn" data-act="copyall" data-id="${p.id}" title="Copy cả hai giá">⧉</button></td>
  </tr>`;
}

/* ============================ TAB: TỒN KHO ============================ */
function viewStock(){
  const list = filtered();
  const S = DB.settings;
  let totalValue=0, nIn=0, nLow=0;
  DB.products.forEach(p=>{ const c=calc(p); totalValue+=c.stockValue; if(c.totalMl>0){nIn++; if(c.totalMl<num(S.lowMl)) nLow++;} });
  const rows = list.map(p=>{
    const c = calc(p);
    const dsz = num(S.decantSize)||10;
    const decLeft = Math.floor(c.totalMl/dsz);
    const pct = c.size ? Math.max(0, Math.min(100, num(p.openMl)/c.size*100)) : 0;
    const neg = c.totalMl < 0;
    const low = c.totalMl>0 && c.totalMl<num(S.lowMl);
    return `<tr>
      <td class="l nm" data-l="Sản phẩm"><b>${esc(p.name)}</b>${p.brand?`<div class="tiny muted">${esc(p.brand)}</div>`:''}</td>
      <td data-l="Chai full nguyên">${inp(p,'stockFull','0')}</td>
      <td data-l="Chai đang chiết (ml)">${inp(p,'openMl','0')}
        ${c.size&&num(p.openMl)>0?`<span class="mlbar ${low?'low':''}" title="${fmt(num(p.openMl))}/${c.size}ml"><i style="width:${pct}%"></i></span>`:''}</td>
      <td data-l="Tổng ml">${c.totalMl?`<b class="num" ${neg?'style="color:var(--bad)"':''}>${fmt(c.totalMl)}</b>`:'<span class="muted">0</span>'}</td>
      <td data-l="Còn bán được">${ neg ? `<span class="pill bad">bán quá kho ${fmt(-c.totalMl)}ml</span>`
        : decLeft>0 ? `<span class="pill ${low?'bad':'ok'}">${decLeft} lọ ${dsz}ml</span>`
        : '<span class="pill mute">hết</span>'}</td>
      <td class="hide-sell" data-l="Vốn đang nằm">${c.stockValue?`<span class="num" ${c.stockValue<0?'style="color:var(--bad)"':''} ${c.stockValueEstimated?'title="Ước tính theo bảng giá — bấm ＋ Nhập để ghi giá mua thực"':''}>${fmt(Math.round(c.stockValue))}${c.stockValueEstimated?'<span class="muted">*</span>':''}</span>`:'<span class="muted">—</span>'}</td>
      <td data-l=""><div class="rowact">
        <button class="btn sm" data-act="openbottle" data-id="${p.id}" ${num(p.stockFull)?'':'disabled style="opacity:.4"'} title="Bóc 1 chai full ra để chiết">Mở chai</button>
        <button class="btn sm" data-act="restock" data-id="${p.id}" title="Nhập thêm hàng">＋ Nhập</button>
      </div></td>
    </tr>`;
  }).join('');
  return `
  <div class="kpis">
    <div class="kpi hide-sell"><div class="k">Vốn đang nằm trong kho</div><div class="v" style="color:${totalValue<0?'var(--bad)':'inherit'}">${fmt(Math.round(totalValue))}</div><div class="s">${vnd(totalValue)}</div></div>
    <div class="kpi"><div class="k">Sản phẩm còn hàng</div><div class="v">${nIn}</div><div class="s">trên tổng ${DB.products.length}</div></div>
    <div class="kpi"><div class="k">Sắp hết</div><div class="v" style="color:${nLow?'var(--bad)':'inherit'}">${nLow}</div><div class="s">dưới ${num(S.lowMl)}ml</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>Tồn kho <span class="sub">sửa trực tiếp, tự lưu</span></h2>
    <div class="tblwrap">
      ${list.length?`<table class="resp"><thead><tr>
        <th class="l">Sản phẩm</th><th>Chai full</th><th>Chai đang chiết (ml)</th>
        <th>Tổng ml</th><th>Còn bán được</th><th class="hide-sell">Vốn đang nằm</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      :`<div class="empty"><b>Trống</b>Chưa có sản phẩm nào khớp bộ lọc.</div>`}
    </div>
    <div class="legend"><span>Bán 1 lọ chiết trong tab <b>Đơn hàng</b> sẽ tự trừ ml ở đây.</span>
      <span>Hết ml mà còn chai full thì hệ thống tự bóc chai mới.</span>
      <span><b>*</b> = vốn ước tính theo bảng giá. Bấm <b>＋ Nhập</b> để ghi giá mua thật.</span></div>
  </div>`;
}
</script>
<script>
/* ============================ ĐƠN HÀNG ============================ */
function orderTotals(o){
  let rev=0, cost=0, qty=0;
  (o.items||[]).forEach(it=>{ rev += num(it.price)*num(it.qty); cost += num(it.cost)*num(it.qty); qty += num(it.qty); });
  rev -= num(o.discount);
  cost += num(o.shipFee);
  return { rev, cost, profit:rev-cost, qty, margin: rev? (rev-cost)/rev*100 : 0 };
}
function applyStock(order, sign){           // sign=+1 trừ kho, -1 hoàn kho
  const warn=[];
  (order.items||[]).forEach(it=>{
    const p = productById(it.pid); if(!p) return;
    const size = num(p.sizeMl);
    if(it.type==='full'){
      p.stockFull = num(p.stockFull) - sign*num(it.qty);
    }else{
      const need = sign*num(it.ml)*num(it.qty);
      if(sign>0 && size>0){
        while(num(p.openMl) < need && num(p.stockFull) > 0){
          p.stockFull = num(p.stockFull)-1; p.openMl = num(p.openMl)+size;
        }
      }
      p.openMl = num(p.openMl) - need;
    }
    if(num(p.openMl)<0 || num(p.stockFull)<0) warn.push(p.name);
  });
  return [...new Set(warn)];
}
function stockWarn(list, okMsg){
  toast(list.length ? '⚠ Bán quá tồn kho: '+list.join(', ')+' — nhớ nhập thêm' : okMsg);
}
function setOrderStatus(id, status){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  let w=[];
  if(status==='done' && !o.applied){ w=applyStock(o,+1); o.applied=true; }
  if(status!=='done' && o.applied){ applyStock(o,-1); o.applied=false; }
  o.status = status; save(); render();
  stockWarn(w, status==='done' ? 'Đã chốt đơn, kho đã trừ' : 'Đã mở lại đơn, kho đã hoàn');
}

function viewOrders(){
  const q = norm(UI.q);
  let list = [...DB.orders].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  if(q) list = list.filter(o=> norm((o.customer||'')+' '+(o.code||'')+' '+(o.note||'')+' '+(o.items||[]).map(i=>i.name).join(' ')).includes(q));
  const rows = list.map(o=>{
    const t = orderTotals(o);
    const st = o.status==='done' ? '<span class="pill ok">Đã chốt</span>'
             : o.status==='cancel' ? '<span class="pill bad">Đã huỷ</span>'
             : '<span class="pill warn">Nháp</span>';
    return `<tr>
      <td class="l nm" data-l="Khách">
        <b>${esc(o.customer||'Khách lẻ')}</b>
        <div class="tiny muted">${esc(o.date||'')}${o.channel?' · '+esc(chName(o.channel)):''} · ${(o.items||[]).length} món</div>
        <div class="tiny muted">${esc((o.items||[]).map(i=>i.name+(i.type==='decant'?` ${num(i.ml)}ml`:' full')+(num(i.qty)>1?` ×${num(i.qty)}`:'')).join(', '))}</div>
      </td>
      <td data-l="Doanh thu"><b class="num">${fmt(Math.round(t.rev))}</b></td>
      <td class="hide-sell" data-l="Vốn"><span class="num muted">${fmt(Math.round(t.cost))}</span></td>
      <td class="hide-sell" data-l="Lợi nhuận">${marginPill(t.profit, t.margin)}</td>
      <td data-l="Trạng thái">${st}</td>
      <td data-l=""><div class="rowact">
        ${o.status==='done'
          ? `<button class="btn sm" data-act="unlock" data-id="${o.id}" title="Mở lại đơn, hoàn ml về kho">↩ Mở lại</button>`
          : `<button class="btn sm primary" data-act="confirm" data-id="${o.id}" title="Chốt đơn và trừ kho">✓ Chốt</button>`}
        <button class="iconbtn" data-act="editorder" data-id="${o.id}">✎</button>
        <button class="iconbtn" data-act="delorder" data-id="${o.id}">🗑</button>
      </div></td>
    </tr>`;
  }).join('');
  const done = DB.orders.filter(o=>o.status==='done');
  const sum = done.reduce((a,o)=>{const t=orderTotals(o); a.rev+=t.rev; a.profit+=t.profit; return a;},{rev:0,profit:0});
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">Đơn đã chốt</div><div class="v">${done.length}</div><div class="s">${DB.orders.length} đơn tổng cộng</div></div>
    <div class="kpi"><div class="k">Doanh thu (tất cả thời gian)</div><div class="v">${fmt(Math.round(sum.rev))}</div><div class="s">${vnd(sum.rev)}</div></div>
    <div class="kpi hide-sell"><div class="k">Lợi nhuận (tất cả thời gian)</div><div class="v" style="color:var(--ok)">${fmt(Math.round(sum.profit))}</div><div class="s">${vnd(sum.profit)}</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>Đơn hàng <button class="btn sm primary" data-act="neworder">＋ Đơn mới</button></h2>
    <div class="tblwrap">
      ${list.length?`<table class="resp"><thead><tr><th class="l">Khách</th><th>Doanh thu</th>
        <th class="hide-sell">Vốn</th><th class="hide-sell">Lợi nhuận</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      :`<div class="empty"><b>Chưa có đơn nào</b>Bấm “＋ Đơn mới”, chọn sản phẩm — giá bán và giá vốn tự điền, chốt đơn là kho tự trừ.</div>`}
    </div>
  </div>`;
}

/* ---------- modal đơn hàng ---------- */
let DRAFT = null;
function newOrder(){
  DRAFT = { id:uid(), date:today(), customer:'', channel:curCh(), note:'', items:[],
            discount:'', shipFee:'', status:'draft', applied:false, _new:true };
  openOrderModal();
}
function editOrder(id){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  DRAFT = JSON.parse(JSON.stringify(o)); DRAFT._new=false;
  openOrderModal();
}
function draftItemHTML(it,i){
  const dsz = num(DB.settings.decantSize)||10;
  return `<div class="itemrow" data-i="${i}">
    <div class="nmm">${esc(it.name)}</div>
    <select class="inp" data-d="type" data-i="${i}" style="padding:6px 8px">
      <option value="decant" ${it.type==='decant'?'selected':''}>Chiết</option>
      <option value="full" ${it.type==='full'?'selected':''}>Chai full</option>
    </select>
    <input class="inp" data-d="ml" data-i="${i}" inputmode="decimal" value="${it.type==='decant'?esc(it.ml):''}"
      placeholder="ml" ${it.type==='full'?'disabled':''} style="padding:6px 8px;text-align:right">
    <input class="inp" data-d="qty" data-i="${i}" inputmode="decimal" value="${esc(it.qty)}" style="padding:6px 8px;text-align:right" placeholder="SL">
    <input class="inp" data-d="price" data-i="${i}" inputmode="decimal" value="${esc(it.price)}" style="padding:6px 8px;text-align:right" placeholder="Đơn giá">
    <button class="iconbtn" data-act="delitem" data-i="${i}">✕</button>
  </div>`;
}
function itemPriceFor(p, type, ml, ch){
  const S = DB.settings, c = calc(p, ch||curCh()), dsz = num(S.decantSize)||10, bc = num(S.bottleCost);
  if(type==='full') return { price: Math.round(c.priceFull||0), cost: Math.round(c.costFull||0) };
  const k = num(ml)/dsz || 1;
  const cd = c.costDecant||0;
  // vỏ + công chiết tốn nguyên 1 lần dù lọ 5ml hay 20ml
  const cost = cd > bc ? Math.round((cd-bc)*k + bc) : Math.round(cd*k);
  const dat = dxGet(p, num(ml), ch||curCh());            // giá bạn đã đặt riêng cho cỡ này
  const price = dat ? Math.round(dat)
              : (k===1 ? Math.round(c.priceDecant||0)
                       : roundTo(cost*chMarkup(ch||curCh(),'decant'), S.roundTo));
  return { price, cost };
}
function itemsHTML(){
  if(!DRAFT.items.length) return `<div class="hint">Chưa có món nào — gõ vào ô trên để thêm.</div>`;
  return `<div style="margin-bottom:10px">
    <div class="itemrow tiny muted" style="border-bottom:1px solid var(--line)">
      <div class="nmm">Sản phẩm</div><div>Loại</div><div style="text-align:right">ml</div>
      <div style="text-align:right">SL</div><div style="text-align:right">Đơn giá</div><div></div></div>
    ${DRAFT.items.map(draftItemHTML).join('')}
  </div>`;
}
function totalsHTML(){
  const t = orderTotals(DRAFT), u = U();
  return `<div class="card" style="box-shadow:none;background:var(--panel2)"><div class="pad">
    <div class="stat-row"><span>Doanh thu</span><b>${fmt(Math.round(t.rev))}${u}</b></div>
    <div class="stat-row"><span>Vốn hàng + ship</span><b class="muted">${fmt(Math.round(t.cost))}${u}</b></div>

function saveDraft(confirmIt){
  DRAFT.items = DRAFT.items.filter(it=>num(it.qty)>0);
  if(!DRAFT.items.length){ toast('Đơn chưa có món nào'); return; }
  const idx = DB.orders.findIndex(o=>o.id===DRAFT.id);
  const prev = idx>=0 ? DB.orders[idx] : null;
  if(prev && prev.applied){ applyStock(prev,-1); prev.applied=false; }   // hoàn kho theo bản cũ
  const o = JSON.parse(JSON.stringify(DRAFT)); delete o._new;
  o.applied = false;
  o.status = confirmIt ? 'done' : 'draft';
  let w=[];
  if(confirmIt){ w = applyStock(o,+1); o.applied = true; }
  if(idx>=0) DB.orders[idx]=o; else DB.orders.push(o);

/* quy đổi mọi con số tiền khi đổi đơn vị — bỏ sót chỗ nào là sai 1000 lần */
function convertUnit(f){
  const MF = ['costFull','refFull','costDecant','refDecant'];
  DB.products.forEach(p=>{
    MF.forEach(k=>{ if(p[k]!=='' && p[k]!=null) p[k] = +(num(p[k])*f).toFixed(4); });
    ['priceFull','priceDecant'].forEach(k=>{ const o=p[k]||{};
      Object.keys(o).forEach(ch=>{ o[ch] = +(num(o[ch])*f).toFixed(4); }); });
    [...(p.refsFull||[]),...(p.refsDecant||[])].forEach(r=>{ if(r.price!=='' && r.price!=null) r.price = +(num(r.price)*f).toFixed(4); });
    if(p.realPerMl) p.realPerMl = p.realPerMl*f;
  });
  DB.orders.forEach(o=>{
    (o.items||[]).forEach(i=>{ i.price=+(num(i.price)*f).toFixed(4); i.cost=+(num(i.cost)*f).toFixed(4); });
    if(o.discount!=='' && o.discount!=null) o.discount = +(num(o.discount)*f).toFixed(4);
    if(o.shipFee !=='' && o.shipFee !=null) o.shipFee  = +(num(o.shipFee )*f).toFixed(4);
  });
  (DB.purchases||[]).forEach(x=>{ x.unitPrice=x.unitPrice*f; x.total=x.total*f; });
  DB.settings.bottleCost = num(DB.settings.bottleCost)*f;
  DB.settings.roundTo    = Math.max(1, Math.round(num(DB.settings.roundTo)*f));
}

function openRestock(id){

  $('#modalRoot').innerHTML = `

      <p class="hint" style="margin-top:10px">Giá mua ở đây là tiền thật bạn bỏ ra — dùng để tính “vốn đang nằm trong kho” cho đúng, không lấy theo bảng giá.</p>
    </div>
    <footer><button class="btn" data-close="1">Huỷ</button>
      <button class="btn primary" data-act="dorestock" data-id="${id}">Nhập kho</button></footer>
  </div></div>`;
  const upd = () => {
    const isFull = $('#rkType').value==='full';
    $('#rkQtyLbl').textContent   = isFull ? 'Số chai' : 'Số ml';
    $('#rkPriceLbl').textContent = isFull ? `Giá mua mỗi chai (${U()})` : `Giá mua mỗi ml (${U()})`;
    const q = num($('#rkQty').value), pr = num($('#rkPrice').value);
    const addMl = isFull ? q*size : q, addCost = q*pr;
    const oldMl = c.totalMl, oldVal = oldMl*num(p.realPerMl);
    const newPerMl = (oldMl+addMl) ? (oldVal+addCost)/(oldMl+addMl) : 0;
    $('#rkPreview').innerHTML = `
      <div class="stat-row"><span>Thêm vào kho</span><b>${fmt(addMl)}ml</b></div>

      <div class="stat-row"><span>Giá vốn thực bình quân</span><b>${newPerMl?fmt(newPerMl,2)+U()+'/ml':'—'}</b></div>`;
  };
  ['rkType','rkQty','rkPrice'].forEach(id=>{ const el=$('#'+id); el.addEventListener('input',upd); el.addEventListener('change',upd); });
  upd();
}
function doRestock(id){
  const p = productById(id); if(!p) return;
  const isFull = $('#rkType').value==='full', size = num(p.sizeMl);
  const q = num($('#rkQty').value), pr = num($('#rkPrice').value);
  if(q<=0){ toast('Số lượng phải lớn hơn 0'); return; }
  if(isFull && !size){ toast('Cần điền dung tích chai trước'); return; }
  const addMl = isFull ? q*size : q, addCost = q*pr;
  const c = calc(p), oldMl = c.totalMl, oldVal = oldMl*num(p.realPerMl);
  p.realPerMl = (oldMl+addMl) ? (oldVal+addCost)/(oldMl+addMl) : 0;
  if(isFull) p.stockFull = num(p.stockFull)+q; else p.openMl = num(p.openMl)+q;
  DB.purchases.unshift({ ts:new Date().toISOString(), date:$('#rkDate').value||today(), pid:id,
    name:p.name, kind:isFull?'full':'ml', qty:q, unitPrice:pr, total:addCost, ml:addMl, note:$('#rkNote').value||'' });
  save(); closeModal(); render();
  toast(`Đã nhập ${fmt(addMl)}ml · ${fmt(Math.round(addCost))}${U()}`);
}

<script>
/* ============================ TAB: BÁO CÁO ============================ */
function viewReport(){
  const m = UI.month;
  const inMonth = DB.orders.filter(o=>o.status==='done' && (o.date||'').slice(0,7)===m);
  let rev=0, cost=0, items=0;
  const byProd = {};
  inMonth.forEach(o=>{
    const t = orderTotals(o); rev+=t.rev; cost+=t.cost; items+=t.qty;
    (o.items||[]).forEach(it=>{
      const k = it.pid || it.name;
      byProd[k] = byProd[k] || { name:it.name, qty:0, rev:0, profit:0 };
      byProd[k].qty    += num(it.qty);
      byProd[k].rev    += num(it.price)*num(it.qty);
      byProd[k].profit += (num(it.price)-num(it.cost))*num(it.qty);
    });
  });
  const profit = rev-cost, margin = rev? profit/rev*100 : 0;
  const top = Object.values(byProd).sort((a,b)=>b.profit-a.profit).slice(0,8);
  const maxP = top.length ? Math.max(...top.map(t=>t.profit)) : 1;

  let stockValue=0; DB.products.forEach(p=>stockValue+=calc(p).stockValue);
  const alerts = DB.products.map(p=>({p,c:calc(p)})).filter(x=>x.c.flags.length)
                   .sort((a,b)=> (b.c.worst==='bad') - (a.c.worst==='bad'));

  return `
  <div class="card"><div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <b>Tháng</b><input class="inp" type="month" id="monthPick" value="${m}" style="max-width:180px">
    <span class="muted tiny">${inMonth.length} đơn đã chốt trong tháng · đơn nháp không được tính</span>
  </div></div>
  <div class="kpis" style="margin-top:14px">
    <div class="kpi"><div class="k">Doanh thu</div><div class="v">${fmt(Math.round(rev))}</div><div class="s">${vnd(rev)}</div></div>
    <div class="kpi hide-sell"><div class="k">Vốn hàng + ship</div><div class="v">${fmt(Math.round(cost))}</div><div class="s">${vnd(cost)}</div></div>
    <div class="kpi hide-sell"><div class="k">Lợi nhuận</div><div class="v" style="color:${profit>=0?'var(--ok)':'var(--bad)'}">${fmt(Math.round(profit))}</div><div class="s">biên ${margin.toFixed(1)}%</div></div>
    <div class="kpi"><div class="k">Số món đã bán</div><div class="v">${fmt(items)}</div><div class="s">${inMonth.length} đơn</div></div>
    <div class="kpi hide-sell"><div class="k">Vốn nằm trong kho</div><div class="v">${fmt(Math.round(stockValue))}</div><div class="s">${vnd(stockValue)}</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Sản phẩm lãi nhất tháng này</h2>
    ${top.length ? `<div class="pad">${top.map(t=>`
      <div style="padding:8px 0;border-bottom:1px solid var(--line2)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <b style="font-size:13.5px">${esc(t.name)}</b>

        </div>
        <div class="bar"><i style="width:${Math.max(2,t.profit/maxP*100)}%"></i></div>

    : `<div class="empty"><b>Chưa có đơn chốt nào trong tháng ${m}</b>Chốt đơn ở tab Đơn hàng để số liệu chạy vào đây.</div>`}
  </div>

  <div class="card">
    <h2>Cần xem lại <span class="sub">${alerts.length} sản phẩm</span></h2>
    ${alerts.length ? `<div class="warnlist">${alerts.slice(0,25).map(({p,c})=>`

        <span class="dot ${c.worst}"></span>

        <button class="btn sm" data-act="detail" data-id="${p.id}">Sửa</button>

  </div>`;
}

    : `<div class="empty"><b>Chưa nhập kho lần nào</b>Bấm <b>＋ Nhập</b> ở tab Tồn kho để ghi giá mua thật — vốn tồn kho mới đúng.</div>`}

    ${hist ? `<div class="warnlist">${hist}</div>` : `<div class="empty"><b>Chưa có thay đổi nào</b>Mỗi lần bạn sửa một ô giá, hệ thống ghi lại giá cũ ở đây.</div>`}

}

<script>
/* ============================ CSV ============================ */
/* Excel bản Việt xuất bằng dấu ; và KHÔNG bọc nháy quanh field có dấu phẩy.
   Phải chốt MỘT dấu ngăn cách, nếu không tên "Dior Sauvage, bản EDP" sẽ bị xé cột. */
function detectDelim(text){
  const line = text.replace(/^﻿/,'').split(/\r?\n/)[0] || '';
  const n = {',':0, ';':0, '\t':0}; let q=false;
  for(const ch of line){ if(ch==='"') q=!q; else if(!q && n[ch]!==undefined) n[ch]++; }
  const best = Object.keys(n).sort((a,b)=>n[b]-n[a])[0];
  return n[best] ? best : ',';
}
function parseCSV(text, delim){
  text = text.replace(/^﻿/,'');
  const D = delim || detectDelim(text);
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===D){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch==='\r'){}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
const refsToText = list => (list||[]).filter(r=>num(r.price)>0)
  .map(r=>num(r.price)+(r.src?'@'+String(r.src).replace(/[|]/g,'/'):'')).join(' | ');
const textToRefs = t => String(t||'').split('|').map(x=>x.trim()).filter(Boolean).map(x=>{
  const i = x.indexOf('@');
  return i<0 ? {price:num(x), src:'', date:''} : {price:num(x.slice(0,i)), src:x.slice(i+1).trim(), date:''};
}).filter(r=>r.price>0);

function mapHeader(h){
  const n = norm(h);
  if(!n) return null;
  if(/chi tiet/.test(n)) return /chiet|ml/.test(n.replace(/chi tiet/g,'')) ? 'refsDecantRaw' : 'refsFullRaw';
  if(/ban/.test(n)){                                  // "FULL Bán (Website)" / "Chiết 5ml Bán (TikTok)"
    const m = n.match(/\(([^)]+)\)/);
    if(m){ const c = chList().find(x=>norm(x.name)===m[1].trim() || x.id===m[1].trim());
           if(c){
             if(!/chiet/.test(n)) return 'px_full_' + c.id;
             const z = n.match(/chiet\s*(\d+)\s*ml/);
             if(z && !laCoChuan(num(z[1]))) return 'dx_' + num(z[1]) + '_' + c.id;
             return 'px_decant_' + c.id;
           } }
  }
  if(/^(ten|san pham|product|name)/.test(n)) return 'name';
  if(/(thuong hieu|brand)/.test(n)) return 'brand';
  if(n==='ml' || /dung tich/.test(n)) return 'sizeMl';
  if(/nguon/.test(n)) return 'refSource';
  if(/(ghi chu|note)/.test(n)) return 'note';
  if(/chai/.test(n) && /(ton|kho)/.test(n)) return 'stockFull';
  if(/(dang chiet|da mo|open)/.test(n)) return 'openMl';
  const dec = /chiet/.test(n) || /^\d*\s*ml/.test(n);
  const von = /(von|cost)/.test(n), ban = /(ban|sell|price)/.test(n), tk = /(tham khao|thi truong|ref)/.test(n);
  if(dec){ if(von) return 'costDecant'; if(ban) return 'priceDecant'; if(tk) return 'refDecant'; }
  else    { if(von) return 'costFull';   if(ban) return 'priceFull';   if(tk) return 'refFull'; }
  return null;
}
function importCSV(text){
  const rows = parseCSV(text);
  if(!rows.length){ toast('File rỗng'); return; }
  let hi = rows.findIndex(r=>r.some(c=>mapHeader(c)==='name'));
  if(hi<0) hi = 0;
  const map = rows[hi].map(mapHeader);
  if(!map.includes('name')){
    ask('Không tìm thấy cột <b>Tên</b> trong file.<br>File cần có một dòng tiêu đề chứa cột Tên (hoặc Sản phẩm).', ()=>{}, 'Đã hiểu');
    return; }
  let added=0, updated=0;
  for(let i=hi+1;i<rows.length;i++){
    const r = rows[i]; const rec = {};
    map.forEach((f,j)=>{ if(f && r[j]!==undefined && String(r[j]).trim()!=='') rec[f]=String(r[j]).trim(); });
    if(!rec.name) continue;
    const numFields=['sizeMl','costFull','priceFull','refFull','costDecant','priceDecant','refDecant','stockFull','openMl'];
    numFields.forEach(f=>{ if(rec[f]!==undefined){ const v=num(rec[f]); rec[f]= v? v : ''; } });
    // gom các cột giá bán theo kênh
    const pxF={}, pxD={}, dxExtra={};
    Object.keys(rec).forEach(k=>{
      if(k.startsWith('px_full_'))   { const v=num(rec[k]); if(v) pxF[k.slice(8)]=v;  delete rec[k]; }
      if(k.startsWith('px_decant_')) { const v=num(rec[k]); if(v) pxD[k.slice(10)]=v; delete rec[k]; }
      if(k.startsWith('dx_'))         { const v=num(rec[k]); const [,z,ch]=k.split('_');
                                        if(v){ dxExtra[z]=dxExtra[z]||{}; dxExtra[z][ch]=v; } delete rec[k]; }
    });
    if(rec.priceFull)   { pxF[CH0] = num(rec.priceFull);   delete rec.priceFull; }
    if(rec.priceDecant) { pxD[CH0] = num(rec.priceDecant); delete rec.priceDecant; }
    const rf = rec.refsFullRaw!==undefined ? textToRefs(rec.refsFullRaw)
             : (rec.refFull ? [{price:num(rec.refFull), src:rec.refSource||'', date:''}] : null);
    const rd = rec.refsDecantRaw!==undefined ? textToRefs(rec.refsDecantRaw)
             : (rec.refDecant ? [{price:num(rec.refDecant), src:rec.refSource||'', date:''}] : null);
    delete rec.refsFullRaw; delete rec.refsDecantRaw; delete rec.refFull; delete rec.refDecant;
    const ex = DB.products.find(p=>norm(p.name)===norm(rec.name));
    if(ex){ Object.entries(rec).forEach(([f,v])=>{ if(v!==''&&v!==undefined&&String(ex[f]||'')!==String(v)){ logChange(ex.id,f,ex[f],v); ex[f]=v; } });
            if(rf) ex.refsFull=rf; if(rd) ex.refsDecant=rd;
            if(Object.keys(pxF).length) ex.priceFull   = {...(ex.priceFull||{}),   ...pxF};
            if(Object.keys(pxD).length) ex.priceDecant = {...(ex.priceDecant||{}), ...pxD};
            if(Object.keys(dxExtra).length) ex.priceDecantBySize = {...(ex.priceDecantBySize||{}), ...dxExtra};
            ex.updatedAt=today(); delete ex.sample; updated++; }
    else  { DB.products.push({ id:uid(), name:rec.name, brand:rec.brand||'', sizeMl:rec.sizeMl||'',
              costFull:rec.costFull||'', priceFull:pxF,
              costDecant:rec.costDecant||'', priceDecant:pxD, priceDecantBySize:dxExtra,
              refsFull:rf||[], refsDecant:rd||[],
              note:rec.note||'', stockFull:rec.stockFull||0, openMl:rec.openMl||0,
              updatedAt:today() }); added++; }
  }
  save(); render();
  toast(`Đã nhập: thêm mới ${added}, cập nhật ${updated}`);
}
function exportCSV(){
  const dsz = num(DB.settings.decantSize)||10;
  const chs = chList();
  const head = ['Tên','Thương hiệu','ML','FULL (Vốn)',
    ...chs.map(c=>`FULL Bán (${c.name})`), 'Tham khảo',
    `Chiết ${dsz}ml (Vốn)`, ...chs.map(c=>`Chiết Bán (${c.name})`),
    ...dsizes().filter(z=>!laCoChuan(z)).flatMap(z=>chs.map(c=>`Chiết ${z}ml Bán (${c.name})`)),
    'ml (Tham khảo)',
    'Chi tiết tham khảo full','Chi tiết tham khảo chiết','Ghi chú','Tồn chai full','ml đang chiết'];
  const q = v => { const s = (v===0?'':String(v??'')); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.join(',')].concat(DB.products.map(p=>{
    const rF=refStats(p.refsFull), rD=refStats(p.refsDecant);
    return [p.name,p.brand,p.sizeMl,p.costFull,
      ...chs.map(c=>pxGet(p.priceFull,c.id)||''), rF.n?rF.min:'',
      p.costDecant, ...chs.map(c=>pxGet(p.priceDecant,c.id)||''),
      ...dsizes().filter(z=>!laCoChuan(z)).flatMap(z=>chs.map(c=>dxGet(p,z,c.id)||'')),
      rD.n?rD.min:'',
      refsToText(p.refsFull), refsToText(p.refsDecant), p.note,p.stockFull,p.openMl].map(q).join(',');
  }));
  download('bang-gia-nuoc-hoa-'+today()+'.csv', '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function pickFile(accept, cb){
  const i = document.createElement('input'); i.type='file'; i.accept=accept;
  i.onchange = () => { const f=i.files[0]; if(!f) return; const r=new FileReader();
    r.onload = () => cb(r.result); r.readAsText(f,'utf-8'); };
  i.click();
}
function copyText(t){
  const done = ()=>toast('Đã copy: '+t.slice(0,42)+(t.length>42?'…':''));
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done).catch(fallback); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('Không copy được');} ta.remove(); }
}

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.matches('[data-px]')){                              // giá bán của một kênh
    if(t.dataset.px==='decant' && t.dataset.sz){
      const p = productById(t.dataset.id);
      if(p){ const cu = dxGet(p, t.dataset.sz, t.dataset.ch);
             if(t.value.trim()!=='' && num(t.value)<0){ toast('Không nhận số âm'); render(); return; }
             dxSet(p, t.dataset.sz, t.dataset.ch, t.value.trim());
             logChange(p.id, `Bán chiết ${num(t.dataset.sz)}ml@${t.dataset.ch}`, cu, dxGet(p,t.dataset.sz,t.dataset.ch));
             p.updatedAt = today(); delete p.sample; save(); }
      if(UI.tab==='price') refreshRow(t.dataset.id); else render();
      return;
    }
    setPrice(t.dataset.id, t.dataset.px, t.dataset.ch, t.value.trim());
    if(UI.tab==='price') refreshRow(t.dataset.id); else render();
    return;
  }
  if(t.matches('#chPick')){ UI.channel = t.value; render(); return; }
  if(t.matches('#szPick')){ UI.dsize = num(t.value); render(); return; }
  if(t.matches('.cell')){                                  // ô trong bảng
    setField(t.dataset.id, t.dataset.f, t.value.trim());
    if(UI.tab==='price') refreshRow(t.dataset.id); else render();
    return;
  }
  if(t.matches('[data-p]')){
    setField(t.dataset.id, t.dataset.p, t.value.trim());
    if(t.dataset.p==='brand'){ const dl=$('#brands'); if(dl) dl.innerHTML = brandOptions(); }
    return; }
  if(t.matches('[data-r]') && REFS){
    const p = productById(REFS.pid), list = refsOf(p,REFS.kind), r = list[num(t.dataset.i)];
    if(!r) return;
    const f = t.dataset.r;
    if(f==='price'){
      const n = num(t.value);
      if(t.value.trim()!=='' && n<0){ toast('Không nhận số âm'); paintRefs(); return; }
      const old = refStats(list).min;
      r.price = t.value.trim()==='' ? '' : n;
      logChange(REFS.pid, REFS.kind==='full'?'refFull':'refDecant', old, refStats(list).min);
    } else r[f] = t.value;
    p.updatedAt = today(); delete p.sample; save();
    if(f==='price') paintRefs();
    return;
  }
  if(t.matches('[data-s]')){ DB.settings[t.dataset.s] = num(t.value); save(); toast('Đã lưu cài đặt'); return; }
  if(t.matches('[data-ch]')){
    const i = num(t.dataset.i), c = chList()[i], f = t.dataset.ch; if(!c) return;
    if(f==='id'){
      const nid = norm(t.value).replace(/[^a-z0-9]+/g,'') || c.id;
      if(nid!==c.id){
        if(chList().some(x=>x!==c && x.id===nid)){ toast('Mã kênh này đã có'); render(); return; }
        DB.products.forEach(p=>{ ['priceFull','priceDecant'].forEach(k=>{
          if(p[k] && p[k][c.id]!==undefined){ p[k][nid]=p[k][c.id]; delete p[k][c.id]; } }); });
        if(UI.channel===c.id) UI.channel=nid;
        c.id = nid;
      }
    }
    else if(f==='name') c.name = t.value.trim() || c.id;
    else c[f] = t.value.trim()==='' ? '' : num(t.value);
    save(); render(); return;
  }
  if(t.matches('[data-web-domain]')){
    DB.settings.webDomain = t.value.trim().replace(/\/+$/,''); save(); toast('Đã lưu địa chỉ website'); return;
  }
  if(t.matches('[data-sizes]')){
    const l = String(t.value).split(/[,;\s]+/).map(num).filter(v=>v>0);
    DB.settings.decantSizes = [...new Set(l)].sort((a,b)=>a-b).join(', ');
    save(); render(); toast('Đã lưu các cỡ chiết'); return;
  }
  if(t.matches('[data-s2]')){ DB.settings[t.dataset.s2] = t.value==='1'; save(); render(); toast('Đã lưu cài đặt'); return; }
  if(t.matches('[data-unit]')){
    const to = t.value, from = DB.settings.unit || 'k';
    if(to===from) return;
    const factor = (from==='k' && to==='d') ? 1000 : 1/1000;
    ask(`Đổi đơn vị sang <b>${to==='d'?'đồng':'nghìn đồng'}</b>.<br>Bạn có muốn quy đổi luôn toàn bộ số đang có (nhân ${factor>=1?factor:'1/1000'})?`,
      ()=>{ convertUnit(factor); DB.settings.unit=to; save(); toast('Đã đổi đơn vị và quy đổi số liệu'); },
      'Đổi và quy đổi số');
    // nếu bấm Không thì chỉ đổi nhãn, số giữ nguyên
    CONFIRM_NO = ()=>{ DB.settings.unit=to; save(); render(); toast('Đã đổi đơn vị, số giữ nguyên'); };
    return;
  }
  if(t.matches('#monthPick')){ UI.month = t.value; render(); return; }
  if(t.matches('[data-o]') && DRAFT){
    DRAFT[t.dataset.o] = t.value;
    if(t.dataset.o==='channel'){                       // đổi kênh thì áp lại bảng giá của kênh đó
      DRAFT.items.forEach(it=>{ const p=productById(it.pid); if(!p) return;
        const pr = itemPriceFor(p, it.type, it.ml, DRAFT.channel);
        it.price = pr.price; it.cost = pr.cost; });
      paintItems();
    } else paintTotals();
    return; }
  if(t.matches('[data-d]') && DRAFT){
    const i = num(t.dataset.i), it = DRAFT.items[i], f = t.dataset.d;
    it[f] = t.value;
    if(f==='type'){ const dsz=num(DB.settings.decantSize)||10; it.ml = t.value==='decant'? dsz : ''; }
    if(f==='type'||f==='ml'){ const p=productById(it.pid);
      if(p){ const pr=itemPriceFor(p, it.type, it.ml, DRAFT.channel); it.price=pr.price; it.cost=pr.cost; } }
    if(f==='price'){ const p=productById(it.pid);
      if(p){ it.cost = itemPriceFor(p, it.type, it.ml, DRAFT.channel).cost; } }
    if(f==='type') paintItems();            // đổi loại thì ô ml bật/tắt → vẽ lại danh sách
    else {
      const row=$(`.itemrow[data-i="${i}"]`);
      if(row){ const pi=row.querySelector('[data-d="price"]'); if(pi && f!=='price') pi.value = it.price; }
      paintTotals();
    }
    return;
  }
});

<script>
/* ============================================================
   ĐỒNG BỘ SUPABASE — offline-first
   localStorage là nguồn chính. Supabase giữ bản chung cho mọi máy.
   Gọi thẳng REST (không nạp thư viện) để file vẫn chạy khi mất mạng.
   ============================================================ */
const SB_CFG = 'pm_sb_cfg', SB_SESS = 'pm_sb_sess', SB_BASE = 'pm_sb_base', SB_DIRTY = 'pm_sb_dirty';
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let SYNC = { state:'off', msg:'Chưa bật đồng bộ', busy:false, at:null };
/* điền sẵn project puvela cho đỡ phải gõ — vẫn sửa được */
const SB_MAC_DINH = { url:'https://bekajgoeqyrfrekfplho.supabase.co',
                      key:'sb_publishable_pNRT5LdoRlDaGwgg3DsNqA_1JDKQBTL' };
const sbCfg   = () => lsGet(SB_CFG, SB_MAC_DINH);
const sbSess  = () => lsGet(SB_SESS, null);
const sbOn    = () => { const c=sbCfg(); return !!(c.url && c.key && sbSess()); };
const syncBase  = () => lsGet(SB_BASE, 0);
const syncDirty = () => lsGet(SB_DIRTY, false);

function setSync(state, msg){ SYNC.state=state; SYNC.msg=msg||''; SYNC.at=Date.now(); paintSyncBadge(); }
function paintSyncBadge(){
  const el = $('#syncBadge'); if(!el) return;
  const map = { off:['○','Chưa bật'], ok:['●','Đã đồng bộ'], pending:['◐','Chờ đẩy lên'],
                busy:['◍','Đang đồng bộ…'], error:['▲','Lỗi mạng'], conflict:['▲','Xung đột'] };
  const [ic,lb] = map[SYNC.state] || map.off;
  el.textContent = ic + ' ' + lb;
  el.className = 'btn ghost sync-' + SYNC.state;
  el.title = SYNC.msg || lb;
}

/* ---------- gọi API ---------- */
async function sbFetch(path, opt={}){
  const c = sbCfg();
  if(!c.url || !c.key) throw new Error('Chưa điền địa chỉ project và khoá');
  const sess = sbSess();
  const h = Object.assign({ apikey:c.key, 'Content-Type':'application/json' }, opt.headers||{});
  if(sess && sess.access_token) h.Authorization = 'Bearer ' + sess.access_token;
  const res = await fetch(c.url.replace(/\/+$/,'') + path, Object.assign({}, opt, {headers:h}));
  if(!res.ok){
    let detail=''; try{ const j=await res.json(); detail = j.message||j.error_description||j.msg||j.error||''; }catch(e){}
    const err = new Error(detail || ('HTTP '+res.status)); err.status = res.status; throw err;
  }
  // Supabase trả 201 hoặc 204 kèm thân RỖNG khi ghi với Prefer: return=minimal.
  // Cố JSON.parse chuỗi rỗng sẽ văng "Unexpected end of JSON input" — phải xử lý riêng.
  const txt = await res.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function sbLogin(email, password){
  const c = sbCfg();
  const res = await fetch(c.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{apikey:c.key,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const j = await res.json();
  if(!res.ok) throw new Error(j.error_description || j.msg || j.message || 'Đăng nhập thất bại');
  lsSet(SB_SESS, { access_token:j.access_token, refresh_token:j.refresh_token,
                   expires_at: Date.now() + (j.expires_in||3600)*1000, email:(j.user&&j.user.email)||email,
                   user_id:(j.user&&j.user.id)||'' });
  return true;
}
async function sbRefresh(){
  const c = sbCfg(), sess = sbSess(); if(!sess||!sess.refresh_token) throw new Error('Chưa đăng nhập');
  const res = await fetch(c.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{apikey:c.key,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: sess.refresh_token})
  });
  const j = await res.json();
  if(!res.ok) throw new Error('Phiên đăng nhập hết hạn, cần đăng nhập lại');
  lsSet(SB_SESS, Object.assign({}, sess, { access_token:j.access_token, refresh_token:j.refresh_token,
        expires_at: Date.now() + (j.expires_in||3600)*1000 }));
}
async function sbReady(){
  const sess = sbSess(); if(!sess) throw new Error('Chưa đăng nhập');
  if(sess.expires_at && Date.now() > sess.expires_at - 60000) await sbRefresh();
}

/* ---------- kéo / đẩy ---------- */
const ROW = '/rest/v1/pm_state';
async function sbRow(){
  const uid = (sbSess()||{}).user_id;
  const r = await sbFetch(`${ROW}?user_id=eq.${uid}&select=data,version`);
  return (r && r[0]) || null;
}
/* máy mới toanh: chỉ còn dữ liệu mẫu, chưa có đơn, chưa nhập kho */
function laMayMoi(){
  return (DB.products||[]).every(p=>p.sample)
      && !(DB.orders||[]).length && !(DB.purchases||[]).length;
}
function adopt(remote){
  const backup = JSON.stringify(DB);
  lsSet('pm_backup_truoc_dong_bo', {at:new Date().toISOString(), data:backup});
  DB = remote.data; normalizeDB();
  localStorage.setItem(KEY, JSON.stringify(DB));
  lsSet(SB_BASE, remote.version); lsSet(SB_DIRTY, false);
}
async function syncNow(silent){
  if(SYNC.busy || !sbOn()) return;
  SYNC.busy = true; setSync('busy');
  try{
    await sbReady();
    const uid = (sbSess()||{}).user_id;
    const remote = await sbRow();

    if(!remote){                                   // lần đầu: tạo bản ghi
      await sbFetch(ROW, {method:'POST', headers:{Prefer:'return=minimal'},
        body: JSON.stringify({user_id:uid, data:DB, version:1})});
      lsSet(SB_BASE,1); lsSet(SB_DIRTY,false); setSync('ok','Đã tạo bản trên máy chủ');
    }
    else if(remote.version > syncBase() && syncDirty() && syncBase()===0 && laMayMoi()){
      adopt(remote); render(); setSync('ok','Đã tải dữ liệu về máy này');
      if(!silent) toast('Đã tải toàn bộ dữ liệu từ máy chủ về');
    }
    else if(remote.version > syncBase() && syncDirty()){
      SYNC.busy=false; setSync('conflict','Máy khác đã sửa trong lúc máy này cũng sửa');
      askConflict(remote); return;
    }
    else if(remote.version > syncBase()){          // máy khác mới hơn, máy này chưa sửa
      adopt(remote); render(); setSync('ok','Đã lấy bản mới từ máy khác');
      if(!silent) toast('Đã cập nhật dữ liệu từ máy khác');
    }
    else if(syncDirty()){                          // máy này có thay đổi -> đẩy lên
      const exp = syncBase();
      const out = await sbFetch(`${ROW}?user_id=eq.${uid}&version=eq.${exp}`, {
        method:'PATCH', headers:{Prefer:'return=representation'},
        body: JSON.stringify({data:DB, version:exp+1, updated_at:new Date().toISOString()})});
      if(out && out.length){ lsSet(SB_BASE, exp+1); lsSet(SB_DIRTY,false); setSync('ok','Đã lưu lên máy chủ'); }
      else { SYNC.busy=false; const r2=await sbRow(); setSync('conflict','Bản trên máy chủ đã đổi'); askConflict(r2); return; }
    }
    else setSync('ok','Không có gì thay đổi');
  }catch(e){
    setSync(/đăng nhập/i.test(e.message)?'off':'error', e.message);
    if(!silent) toast('Đồng bộ lỗi: ' + e.message);
  }finally{ SYNC.busy = false; if($('#syncPanel')) paintSyncPanel(); }
}
let syncTimer = null;
function syncTouch(){

}
